<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sheaf Document Studio</title>
<script>
/* Sheaf lives inside Rotawise (Documents). Opened on its own it goes to Rotawise's Documents section.
   Add ?standalone=1 to the address to open it by itself. */
(function(){var inside=false;try{inside=window.parent!==window&&window.parent.location.origin===location.origin}catch(e){}
  if(inside)document.documentElement.classList.add('embed');
  else if(!/[?&]standalone=1/.test(location.search)&&!/^(localhost|127\.)/.test(location.hostname)&&location.protocol!=='file:')location.replace(new URL('../hub/#docs',location.href).href);})();
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout concept: a cool paper desk holds white sheets. Tools are filed like documents,
   each tagged with a dog-eared file glyph coloured by file type. Highlighter yellow marks AI. */
:root{
  --desk:#EEF1F6; --desk-2:#E3E8F0; --sheet:#FFFFFF; --sheet-2:#F7F9FC;
  --ink:#131A2C; --ink-2:#465067; --ink-3:#7A8498; --rule:#D8DEE8; --rule-2:#C5CDDA;
  --accent:#2B3FC4; --accent-2:#2333A3; --accent-soft:#E6E9FB; --accent-ink:#FFFFFF;
  --marker:#FFE14D; --marker-soft:#FFF5BF; --marker-ink:#2A2300;
  --t-pdf:#D23F2E; --t-doc:#2C67D8; --t-xls:#1D8A4A; --t-img:#C25A12; --t-zip:#0F7F8A; --t-lock:#55607A; --t-ai:#8A6D00;
  --ok:#1D8A4A; --warn:#B26B00; --bad:#C53030;
  --shadow:0 1px 2px rgba(19,26,44,.06),0 8px 24px rgba(19,26,44,.08);
  --shadow-lg:0 2px 6px rgba(19,26,44,.08),0 24px 60px rgba(19,26,44,.18);
  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --r-lg:10px;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0D1120; --desk-2:#0A0D19; --sheet:#161C2E; --sheet-2:#1B2236;
  --ink:#E7EBF4; --ink-2:#AAB3C7; --ink-3:#7B859B; --rule:#28304A; --rule-2:#36405E;
  --accent:#8794FF; --accent-2:#A3AEFF; --accent-soft:#232B52; --accent-ink:#0D1120;
  --marker:#FFE14D; --marker-soft:#3A3410; --marker-ink:#2A2300;
  --t-pdf:#FF7B6B; --t-doc:#79A3FF; --t-xls:#4FC985; --t-img:#F39550; --t-zip:#3FC6D0; --t-lock:#A3ADC4; --t-ai:#FFE14D;
  --ok:#4FC985; --warn:#F0B44C; --bad:#FF7B7B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0D1120; --desk-2:#0A0D19; --sheet:#161C2E; --sheet-2:#1B2236;
  --ink:#E7EBF4; --ink-2:#AAB3C7; --ink-3:#7B859B; --rule:#28304A; --rule-2:#36405E;
  --accent:#8794FF; --accent-2:#A3AEFF; --accent-soft:#232B52; --accent-ink:#0D1120;
  --marker:#FFE14D; --marker-soft:#3A3410; --marker-ink:#2A2300;
  --t-pdf:#FF7B6B; --t-doc:#79A3FF; --t-xls:#4FC985; --t-img:#F39550; --t-zip:#3FC6D0; --t-lock:#A3ADC4; --t-ai:#FFE14D;
  --ok:#4FC985; --warn:#F0B44C; --bad:#FF7B7B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:400 14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.no-ai .btn.ai,.no-ai .ai-pill,.no-ai .aipanel{display:none!important}
.sh-grid td.hasfill{background:var(--fill)}
.sh-grid td.hasfill.insel{background:color-mix(in srgb,var(--accent) 22%,var(--fill))}
.sh-grid td.bd{box-shadow:inset 1px 1px 0 #5b6478;border-right-color:#5b6478;border-bottom-color:#5b6478}
.sh-tb .ib.on{background:var(--accent-soft);color:var(--accent)}
.sh-tb input[type=color]{width:30px;height:28px;padding:1px;border:1px solid var(--rule-2);border-radius:6px;background:var(--sheet);cursor:pointer}
.sh-tb .clr{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);margin:0 2px}
.sh-tb select.inp{height:30px;width:auto;padding:0 6px;font-size:12.5px}
/* inside Rotawise: no second app header or welcome banner */
.embed .topbar .brand{display:none}
.embed .topbar{padding-block:8px}
.embed .search{max-width:none;margin-left:0}
.embed .hub{padding-block:16px 40px}
.embed .hero{grid-template-columns:minmax(0,1fr)}
.embed .hero-copy{display:none}
.embed .desk-drop{min-height:170px}
.embed body::before{display:none}

/* App frame */
#app{height:100%;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:var(--sheet);border-bottom:1px solid var(--rule);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none;cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand-name small{display:block;font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.search{flex:1;max-width:560px;position:relative;margin-left:auto}
.search input{width:100%;height:38px;border:1px solid var(--rule);background:var(--sheet-2);border-radius:999px;padding:0 14px 0 38px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--sheet)}
.search svg{position:absolute;left:12px;top:10px;width:18px;height:18px;color:var(--ink-3)}
.search-results{position:absolute;left:0;right:0;top:44px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:6px;max-height:60vh;overflow:auto;z-index:40}
.search-results button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r);cursor:pointer}
.search-results button:hover,.search-results button.on{background:var(--accent-soft)}
.search-results .sd{color:var(--ink-3);font-size:12px}
.ai-pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--marker-soft);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.ai-pill i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.ai-pill.on i{background:var(--ok)}
.main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column}
.view[hidden]{display:none!important}

/* Hub */
.hub{padding-block:28px 64px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.hub-inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;justify-content:center;gap:14px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.hero h1{font-size:clamp(30px,4.2vw,46px);font-weight:800;letter-spacing:-.035em}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--marker) 58%);color:inherit;padding:0 .08em}
.hero p.lede{font-size:16px;color:var(--ink-2);max-width:52ch}
.trust{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--ink-3);font-size:12.5px}
.trust span{display:inline-flex;gap:6px;align-items:center}
.trust svg{width:15px;height:15px}
.desk-drop{position:relative;background:var(--sheet);border:1.5px dashed var(--rule-2);border-radius:4px;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%)}
.desk-drop::after{content:"";position:absolute;right:0;top:0;width:34px;height:34px;background:linear-gradient(225deg,var(--desk) 50%,var(--desk-2) 50%)}
.desk-drop:hover{border-color:var(--accent)}
.desk-drop.over,.dz.over{background:var(--marker-soft);border-color:var(--ink)}
.desk-drop h2{font-size:22px;letter-spacing:-.02em}
.desk-drop .types{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.desk-drop .hint{color:var(--ink-3);font-size:12.5px}
.ftag{font:500 10.5px/1 var(--f-mono);letter-spacing:.04em;padding:5px 7px;border-radius:3px;color:var(--sheet);background:var(--c,var(--ink-3))}

.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.section-head h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.section-head span{color:var(--ink-3);font-size:12.5px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.tool{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .12s,transform .12s}
.tool:hover{border-color:var(--c,var(--accent));transform:translateY(-1px)}
.tool b{display:block;font-weight:650;font-size:14px;letter-spacing:-.005em}
.tool div>span{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.4;margin-top:2px}
.fglyph{flex:none;width:34px;height:40px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;background:var(--c);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);border-radius:2px}
.fglyph::before{content:"";position:absolute;right:0;top:0;width:10px;height:10px;background:rgba(255,255,255,.45)}
.fglyph em{font:600 8.5px/1 var(--f-mono);font-style:normal;letter-spacing:.03em;color:var(--sheet)}
.fglyph svg{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:15px;height:15px;color:var(--sheet)}
.c-pdf{--c:var(--t-pdf)} .c-doc{--c:var(--t-doc)} .c-xls{--c:var(--t-xls)} .c-img{--c:var(--t-img)} .c-zip{--c:var(--t-zip)} .c-lock{--c:var(--t-lock)} .c-ai{--c:var(--t-ai)}
.c-ai .fglyph{background:var(--marker)} .c-ai .fglyph em,.c-ai .fglyph svg{color:var(--marker-ink)}

.staging{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.staging-files{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet-2);border-radius:999px;padding:4px 6px 4px 4px;font-size:12.5px;max-width:100%}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.chip .sz{color:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px;display:flex}
.suggest{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--rule-2);background:var(--sheet);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ai{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.btn.ai:hover{filter:brightness(.97)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--desk)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2);flex:none}
.ib:hover{background:var(--desk);color:var(--ink)}
.ib.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.ib svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.inp,select.inp,textarea.inp{height:36px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet);padding:0 10px;outline:none;width:100%;min-width:0}
textarea.inp{height:auto;padding:10px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--rule-2);border-radius:var(--r);background:none;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--sheet);padding:0 12px;height:32px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}

/* Tool page frame */
.tbar{flex:none;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:var(--sheet);border-bottom:1px solid var(--rule);flex-wrap:wrap;position:sticky;top:0;z-index:4}
.tbar h2{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
.tbar h2 .fglyph{width:24px;height:28px;padding-bottom:3px}
.tbar h2 .fglyph em{font-size:6.5px}
.tbar h2 .fglyph svg{display:none}
.tbar .spacer{flex:1}
.back{border:0;background:none;display:inline-flex;gap:4px;align-items:center;color:var(--ink-2);cursor:pointer;font-weight:600;font-size:13px;padding:6px 8px 6px 2px;border-radius:var(--r)}
.back:hover{color:var(--ink);background:var(--desk)}
.back svg{width:18px;height:18px}
.tbody{flex:1;min-height:0;padding-block:24px 48px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.narrow{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wide{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:14.5px;font-weight:700}
.dz{border:1.5px dashed var(--rule-2);border-radius:var(--r-lg);background:var(--sheet);padding:34px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.dz:hover{border-color:var(--accent)}
.dz h3{font-size:18px;letter-spacing:-.015em}
.dz p{color:var(--ink-3);font-size:13px}
.dz .fglyph{width:44px;height:52px}
.dz .fglyph em{font-size:10px}
.dz .fglyph svg{width:20px;height:20px;top:11px}
.note{font-size:12.5px;color:var(--ink-3)}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--sheet-2);border:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.callout svg{width:16px;height:16px;flex:none;margin-top:2px}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.callout.ai{background:var(--marker-soft);border-color:transparent;color:var(--ink)}

/* File lists / results */
.flist{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--sheet);overflow:hidden}
.fitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule)}
.fitem:last-child{border-bottom:0}
.fitem .thumb{width:44px;height:44px;border-radius:4px;background:var(--desk) center/cover no-repeat;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;overflow:hidden}
.fitem .thumb img,.fitem .thumb canvas{max-width:100%;max-height:100%}
.fitem .meta{min-width:0}
.fitem .meta b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .meta span{font-size:12px;color:var(--ink-3)}
.fitem .acts{display:flex;gap:4px;align-items:center}
.saving{font:600 12px var(--f-mono);padding:3px 7px;border-radius:3px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.saving.none{background:var(--desk);color:var(--ink-3)}
.bar{height:6px;border-radius:3px;background:var(--desk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font:600 22px/1.1 var(--f-mono);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-3)}

/* Page thumbnails grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:14px;user-select:none}
.pcard{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px;cursor:grab;touch-action:pan-y}
.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pcard.ghost{opacity:.35}
.pcard.dragging{position:fixed;z-index:60;pointer-events:none;box-shadow:var(--shadow-lg);cursor:grabbing;transform:rotate(2deg)}
.pcard .pimg{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:var(--desk);border-radius:3px;overflow:hidden}
.pcard .pimg canvas,.pcard .pimg img{max-width:100%;max-height:100%;box-shadow:0 1px 3px rgba(0,0,0,.2);background:#fff;transition:transform .2s}
.pcard .pfoot{display:flex;align-items:center;justify-content:space-between;gap:4px}

function sanitizeHtml(html) {

  root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select,svg,video,audio,canvas,noscript,title,head').forEach(n => n.remove());

      if (n.startsWith('on')) el.removeAttribute(a.name);

      else if (n === 'src' && !/^data:image\//i.test(a.value) && el.tagName === 'IMG') el.removeAttribute(a.name);
      else if (!['href', 'src', 'style', 'colspan', 'rowspan', 'width', 'height', 'align', 'start', 'alt', 'title', 'class'].includes(n)) el.removeAttribute(a.name);
      else if (n === 'class' && !/pagebreak/.test(a.value)) el.removeAttribute(a.name);

  return root.innerHTML;
}
