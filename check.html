<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotawise Speed Test</title>
<style>
body{font-family:system-ui,sans-serif;background:#14273D;color:#fff;margin:0;padding:16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#9fb3c8;font-size:13px;margin-bottom:14px}
.row{background:#1d3450;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.label{font-size:12px;color:#9fb3c8;text-transform:uppercase;letter-spacing:.06em}
.val{font-size:15px;font-weight:700;margin-top:3px;word-break:break-all}
.ok{color:#5BD99B}.bad{color:#FF8B84}.wait{color:#F2C572}
button{width:100%;font-size:18px;font-weight:700;padding:16px;border:0;border-radius:12px;background:#0E7A57;color:#fff;margin:10px 0}
.big{font-size:30px;font-weight:800;text-align:center}
</style></head><body>
<h1>Rotawise Speed Test</h1>
<div class="sub">Tap the button, wait 20 seconds, then screenshot the whole page.</div>
<button id="tapbtn">TAP TO START TEST</button>
<div class="row"><div class="label">Taps</div><div class="big" id="taps">0</div></div>
<div class="row"><div class="label">App version</div><div class="val wait" id="ver">—</div></div>
<div class="row"><div class="label">Download size</div><div class="val wait" id="size">—</div></div>
<div class="row"><div class="label">Download time</div><div class="val wait" id="dl">—</div></div>
<div class="row"><div class="label">JS parse + run time</div><div class="val wait" id="parse">—</div></div>
<div class="row"><div class="label">Login screen appeared in</div><div class="val wait" id="paint">—</div></div>
<div class="row"><div class="label">Device memory</div><div class="val" id="mem">—</div></div>
<div class="row"><div class="label">CPU cores</div><div class="val" id="cpu">—</div></div>
<div class="row"><div class="label">Connection</div><div class="val" id="net">—</div></div>
<div class="row"><div class="label">Browser</div><div class="val" id="ua">—</div></div>
<div class="row"><div class="label">Errors</div><div class="val ok" id="errs">none</div></div>
<div id="host" style="position:absolute;left:-9999px;width:390px;height:700px"></div>
<script>
var taps=0;
document.getElementById('tapbtn').addEventListener('click',function(){taps++;document.getElementById('taps').textContent=taps;if(taps===1)runTest();});
var errs=[];
window.addEventListener('error',function(e){errs.push(e.message);var el=document.getElementById('errs');el.className='val bad';el.textContent=errs.slice(0,3).join(' | ');});
function set(id,t,c){var el=document.getElementById(id);el.textContent=t;el.className='val '+(c||'');}
set('mem',(navigator.deviceMemory||'unknown')+' GB');
set('cpu',navigator.hardwareConcurrency||'unknown');
var c=navigator.connection;set('net',c?((c.effectiveType||'?')+', '+(c.downlink||'?')+' Mbps'):'unknown');
set('ua',navigator.userAgent+' — '+window.innerWidth+'x'+window.innerHeight);

function runTest(){
  set('dl','downloading…','wait');
  fetch('./index.html?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(html){
    var m=html.match(/assets\/(index-[A-Za-z0-9_\-]+\.js)/);
    if(!m){set('dl','bundle not found','bad');return;}
    var t0=performance.now();
    return fetch('./assets/'+m[1]+'?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(js){
      var t1=performance.now();
      set('size',Math.round(js.length/1024)+' KB');
      set('dl',Math.round(t1-t0)+' ms',(t1-t0)<3000?'ok':'bad');
      var v=js.match(/2026\.\d{2}\.\d{2}-\d+/);set('ver',v?v[0]:'unknown','ok');
      // measure parse+execute by loading the real app in a hidden iframe
      var t2=performance.now();
      var f=document.createElement('iframe');
      f.style.cssText='width:390px;height:700px;border:0';
      document.getElementById('host').appendChild(f);
      f.src='./index.html?perf='+Date.now();
      var done=false;
      f.onload=function(){ var t3=performance.now(); if(!done){set('parse',Math.round(t3-t2)+' ms',(t3-t2)<4000?'ok':'bad');} };
      var start=performance.now(),tries=0;
      var iv=setInterval(function(){
        tries++;
        try{
          var d=f.contentDocument;
          if(d&&d.body&&d.body.textContent.indexOf('Employee code')>=0){
            clearInterval(iv);done=true;
            var ms=performance.now()-start;
            set('paint',Math.round(ms)+' ms',ms<5000?'ok':'bad');
          }
        }catch(e){}
        if(tries>60){clearInterval(iv);if(!done)set('paint','TIMED OUT after 30s','bad');}
      },500);
    });
  }).catch(function(e){set('dl','ERROR: '+e.message,'bad');});
}
</script></body></html>
