<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rotawise — Shift & Attendance Management</title>
    <meta name="theme-color" content="#14273D" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #F4F6F8; }
    </style>
    <script type="module" crossorigin src="/ROTAWISE/assets/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app hasn't rendered in 8s, the bundle probably failed to load
      // (usually a stale cached page). Reload once, bypassing the cache.
      setTimeout(function () { try {
        var r = document.getElementById('root');
        if (r && r.children.length === 0) {
          if (!localStorage.getItem('rw_reloaded_' + location.search)) {
            try { localStorage.setItem('rw_reloaded_' + location.search, '1'); } catch (e) {}
            location.replace(location.pathname + '?cb=' + Date.now());
          } else {
            r.innerHTML = '<div style="font-family:system-ui;padding:24px;color:#14273D">'
              + '<h2>Couldn\'t load Rotawise</h2>'
              + '<p>Your browser may be holding an old copy. Close this tab, reopen it, '
              + 'or clear the site data and try again.</p>'
              + '<p style="font-size:12px;color:#888">If this keeps happening, screenshot this message.</p></div>';
          }
        } else {
          try { Object.keys(localStorage).forEach(function(k){ if(k.indexOf('rw_reloaded_')===0) localStorage.removeItem(k); }); } catch (e) {}
        }
      } catch (e) {} }, 8000);
    </script>
  </body>
</html>
