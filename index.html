<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rotawise — Shift & Attendance Management</title>
    <meta name="theme-color" content="#14273D" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #F4F6F8; }
    </style>
    <script type="module" crossorigin src="./assets/app.js?v=hub1"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  <script>
/* Opened from the Rotawise hub: sign in by itself with the same code + PIN (shop login or personal) used there. */
(function(){
  if (window.parent === window) return;
  try { if (window.parent.location.origin !== location.origin) return; } catch (e) { return; }
  var j = null; try { j = JSON.parse(sessionStorage.getItem('rw_sso') || 'null'); } catch (e) {}
  if (!j || !j.code || !j.pin || Date.now() - (j.t || 0) > 12 * 3600e3) return;
  var tries = 0, iv = setInterval(function(){
    var f = document.querySelector('form'), ins = f && f.querySelectorAll('input');
    if (ins && ins.length >= 2 && !f.dataset.rwAuto) {
      f.dataset.rwAuto = '1'; clearInterval(iv);
      var set = function(el, v){ Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(el, v); el.dispatchEvent(new Event('input', { bubbles: true })); };
      set(ins[0], j.code); set(ins[1], j.pin);
      var b = f.querySelector('button[type=submit]'); if (b) b.click();
    }
    if (++tries > 150) clearInterval(iv);
  }, 100);
})();
</script>
</head>
  <body>
    <div id="root"></div>
    <script>
      // If the app hasn't rendered in 8s, the bundle probably failed to load
      // (usually a stale cached page). Reload once, bypassing the cache.
      setTimeout(function () { try {
        var r = document.getElementById('root');
        if (r && r.children.length === 0) {
          if (!localStorage.getItem('rw_reloaded_' + location.search)) {
            try { localStorage.setItem('rw_reloaded_' + location.search, '1'); } catch (e) {}
            location.replace(location.pathname + '?cb=' + Date.now());
          } else {
            r.innerHTML = '<div style="font-family:system-ui;padding:24px;color:#14273D">'
              + '<h2>Couldn\'t load Rotawise</h2>'
              + '<p>Your browser may be holding an old copy. Close this tab, reopen it, '
              + 'or clear the site data and try again.</p>'
              + '<p style="font-size:12px;color:#888">If this keeps happening, screenshot this message.</p></div>';
          }
        } else {
          try { Object.keys(localStorage).forEach(function(k){ if(k.indexOf('rw_reloaded_')===0) localStorage.removeItem(k); }); } catch (e) {}
        }
      } catch (e) {} }, 8000);
    </script>
  </body>
</html>
