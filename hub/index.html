<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotawise</title>
<meta name="theme-color" content="#14273D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314273D'/%3E%3Cpath d='M9 22V10h6a4 4 0 0 1 1 7.9L19 22h-3l-2.6-4H12v4H9zm3-6.6h2.6a1.6 1.6 0 0 0 0-3.2H12z' fill='%23fff'/%3E%3C/svg%3E">
<script src="assets/supabase-js.js"></script>
<style>
:root{
  --navy:#14273D; --navy2:#1d3a5c; --ink:#14273D; --muted:#5b6b7f; --line:#e4e9f0;
  --bg:#eef1f6; --card:#ffffff; --accent:#2b5ce6; --good:#1f9d61; --bad:#d8453c; --warn:#c77d12;
  --r:18px; --sh:0 1px 2px rgba(20,39,61,.06),0 8px 24px rgba(20,39,61,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --navy:#0f1d2e; --ink:#eaf1fb; --muted:#9db0c6; --line:#24344a; --bg:#0b141f; --card:#132233;
    --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme=dark]{
  --navy:#0f1d2e; --ink:#eaf1fb; --muted:#9db0c6; --line:#24344a; --bg:#0b141f; --card:#132233;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%, #1d3a5c 0%, var(--navy) 60%)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);width:100%;max-width:400px;padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .mark{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:800}
.brand h1{font-size:22px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:2px 0 20px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,92,230,.15)}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
.err{background:#fdeceb;color:#9a2a23;border-radius:11px;padding:11px 13px;font-size:14px;margin-top:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .err{background:#3a1f1d;color:#ffb4ad}}

/* ---------- shell ---------- */
#shell{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top .mark{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.top .who .badge{background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px}
.icbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.wrap{max-width:960px;margin:0 auto;width:100%;padding:22px 16px 60px}
.hello{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.hello small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:22px}
.tile{position:relative;border:0;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:18px;display:flex;flex-direction:column;gap:10px;min-height:150px;color:var(--ink);transition:transform .12s ease, box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,39,61,.1),0 18px 40px rgba(20,39,61,.12)}
.tile .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff}
.tile .t{font-size:18px;font-weight:750;letter-spacing:-.01em}
.tile .d{font-size:13.5px;color:var(--muted);margin-top:-4px}
.tile .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.tile.locked{opacity:.55;filter:grayscale(.3)}
.tile .locktag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.empty{margin-top:30px;color:var(--muted);text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- app frame ---------- */
#frame{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.fbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 9px) 12px 9px}
.fbar .back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:7px}
.fbar .ft{font-weight:700}
#frame iframe{flex:1;border:0;width:100%;background:var(--card)}

/* ---------- admin ---------- */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:18px}
.panel h2{margin:0 0 4px;font-size:17px}
.panel p.note{color:var(--muted);font-size:13px;margin:0 0 14px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mode b{font-size:14px}
.mode select{margin-top:7px;padding:8px}
.tbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.off td{opacity:.5}
.who2{display:flex;flex-direction:column}
.who2 small{color:var(--muted)}
.sw{position:relative;display:inline-block;width:40px;height:24px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--good)}
.sw input:checked+span:before{transform:translateX(16px)}
.rolepick{padding:6px 8px;border-radius:9px;font-size:13px}
.save-flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--sh);z-index:60;opacity:0;transition:opacity .2s}
.save-flash.show{opacity:1}
.scrollx{overflow-x:auto}
.mbtn{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,32,.5);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:16px;box-shadow:var(--sh);width:100%;max-width:420px;padding:18px;max-height:90vh;overflow:auto}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sheethead b{font-size:17px}
.sheethead .x{margin-left:auto;background:var(--bg);border:0;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:15px}
.mstat{color:var(--muted);font-size:13px;margin-bottom:14px}
.mactions{display:flex;flex-direction:column;gap:9px}
.mrow{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:12px 14px;font-weight:600;font-size:14.5px}
.mrow.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.mrow.good{background:var(--good);color:#fff;border-color:var(--good)}
.mrow.warn{border-color:var(--warn);color:var(--warn)}
.mrow.bad{border-color:var(--bad);color:var(--bad)}
.mrow.ghost{color:var(--muted)}
.mrow:disabled{opacity:.55}
.mdiv{height:1px;background:var(--line);margin:4px 0}
.segbtns{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.segbtns button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.segbtns button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>

<div id="boot" style="min-height:100%;display:grid;place-items:center"><div class="spin"></div></div>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand"><div class="mark">R</div><h1>Rotawise</h1></div>
    <div class="sub">Sign in with your work login code and PIN.</div>
    <label for="code">Login code or email</label>
    <input id="code" name="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Your login code, or your email" required>
    <label for="pin">PIN</label>
    <input id="pin" name="password" type="password" inputmode="numeric" placeholder="At least 4 digits" required>
    <div id="loginErr" class="err hidden"></div>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
  </form>
</section>

<!-- SHELL -->
<section id="shell" class="hidden">
  <header class="top">
    <div class="mark">R</div><h1>Rotawise</h1>
    <div class="who">
      <span class="badge" id="whoBadge"></span>
      <button class="icbtn hidden" id="adminBtn" title="Admin: people & access">⚙</button>
      <button class="icbtn" id="themeBtn" title="Light / dark">◐</button>
      <button class="icbtn" id="logoutBtn" title="Sign out">⎋</button>
    </div>
  </header>
  <div class="wrap">
    <div id="home">
      <div class="hello" id="hello"></div>
      <div class="grid" id="tiles"></div>
      <div class="empty hidden" id="noapps">No apps have been shared with you yet. Ask your manager to grant access.</div>
    </div>
    <div id="admin" class="hidden"></div>
  </div>
</section>

<!-- APP FRAME -->
<section id="frame" class="hidden">
  <div class="fbar">
    <button class="back" id="frameBack">‹ Apps</button>
    <span class="ft" id="frameTitle"></span>
  </div>
  <iframe id="frameApp" title="App" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
</section>

<div class="save-flash" id="flash"></div>

<script>
/* ============================================================= config */
const SB_URL = 'https://ukddnulxifhixatpmofz.supabase.co';
const SB_KEY = 'sb_publishable_rW6tXWX72TbvHbZvRG8LiQ_yKmLKKFn';
const STAFF_DOMAIN = 'rotawise.staff';
const BUILD = '2026.11.10-hub1';

const ICON = {
  rota:'<path d="M7 4v3M17 4v3M4 9h16M5 7h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  gas:'<path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-1.7.8-3.3 1.7-4.5C9.7 8.8 12 7 12 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  cash:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M9.5 10.2c0-1 1.1-1.7 2.5-1.7s2.5.6 2.5 1.7-1 1.5-2.5 1.8-2.5.8-2.5 1.9 1.1 1.6 2.5 1.6 2.5-.6 2.5-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  docs:'<path d="M7 3h6l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13 3v4h4M9 13h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  admin:'<path d="M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
};
// key, flag column, title, subtitle, where it opens, tint
const APPS = [
  { key:'rota', flag:'can_see_rota', title:'Rota',      sub:'Shifts, attendance & leave',  src:'/rota/',        tint:'#2b5ce6' },
  { key:'gas',  flag:'can_see_gas',  title:'Gas Deliveries', sub:'Orders, stock & rounds', src:'/gas/',         tint:'#e8743b' },
  { key:'cash', flag:'can_see_cash', title:'Cash Up',   sub:'Daily cash reconciliation',   src:'/rota/#cash',   tint:'#1f9d61' },
  { key:'docs', flag:'can_see_docs', title:'Documents', sub:'Merge, edit & sign files',     src:'/sheaf/',       tint:'#7a5af8' },
];

/* ============================================================= data layer
   The hub talks to Supabase through this small API. Tests replace window.RW_API. */
function makeSupabaseApi(){
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  return {
    async getUser(){ const { data } = await sb.auth.getUser(); return data && data.user || null; },
    async signIn(code, pin){
      let c = code.trim().toLowerCase().replace(/\s+/g,'');
      if(c.includes('@') && !c.endsWith('@'+STAFF_DOMAIN)){
        // a real email: look up which login code it belongs to
        const { data } = await sb.rpc('login_code_for', { p_email: c });
        if(!data) return { error: 'Invalid login credentials' };
        c = data;
      } else c = c.replace('@'+STAFF_DOMAIN,'');
      const { error } = await sb.auth.signInWithPassword({ email: c + '@' + STAFF_DOMAIN, password:String(pin) });
      return { error: error && error.message, code: c };
    },
    async signOut(){ try{ await sb.auth.signOut(); }catch(e){} },
    async profile(userId){
      const { data, error } = await sb.from('employees').select('*').eq('auth_user_id', userId).maybeSingle();
      if(error) throw new Error(error.message); return data;
    },
    async appAccess(){
      const { data } = await sb.from('app_settings').select('value').eq('key','app_access').maybeSingle();
      return (data && data.value) || {};
    },
    async setAppAccess(value){
      const { error } = await sb.from('app_settings').upsert({ key:'app_access', value }, { onConflict:'key' });
      if(error) throw new Error(error.message);
    },
    async staff(){
      const { data, error } = await sb.from('employees')
        .select('id,employee_code,name,store_id,is_admin,is_manager,active,can_see_gas,can_see_docs,can_see_cash,can_see_files,can_see_rota,auth_user_id')
        .order('name');
      if(error) throw new Error(error.message); return data||[];
    },
    async stores(){ const { data } = await sb.from('stores').select('id,name').order('name'); return data||[]; },
    async updateEmployee(id, patch){
      const { error } = await sb.from('employees').update(patch).eq('id', id);
      if(error) throw new Error(error.message);
    },
    async gasHasLogin(code){
      // Gas keeps its own staff list; this public lookup only says whether a login code exists there
      try{ const r = await fetch('https://firestore.googleapis.com/v1/projects/rotawise-a2b16/databases/(default)/documents/gas_logins/'+encodeURIComponent(code)); return r.ok; }catch(e){ return false; }
    },
    async log(event, detail){
      try{ await sb.from('client_logs').insert({ build:BUILD, event, detail:detail||null,
        ua:navigator.userAgent, screen:innerWidth+'x'+innerHeight, who: state.me ? (state.me.name||state.me.employee_code) : null }); }catch(e){}
    },
    async staffOp(action, employee_id, pin){
      const { data, error } = await sb.functions.invoke('admin-staff', { body: { action, employee_id, pin } });
      if(error){
        let msg = error.message;
        try{ const ctx = await error.context.json(); if(ctx && ctx.error) msg = ctx.error; }catch(e){}
        throw new Error(msg);
      }
      if(data && data.error) throw new Error(data.error);
      return data;
    }
  };
}

/* ============================================================= state + helpers */
const $ = s => document.querySelector(s);
const state = { api:null, me:null, access:{}, staff:[], stores:[] };

function theme(){
  const t = localStorage.getItem('rw_theme');
  if(t) document.documentElement.setAttribute('data-theme', t);
}
function flipTheme(){
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  const next = cur==='dark' ? 'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('rw_theme', next); }catch(e){}
}
function flash(msg){ const f=$('#flash'); f.textContent=msg; f.classList.add('show'); clearTimeout(flash.t); flash.t=setTimeout(()=>f.classList.remove('show'),1600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* tiny hyperscript helper */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){ const v = attrs[k];
    if(v==null) continue;
    else if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k==='style' && typeof v==='object') Object.assign(el.style, v);
    else if(k.slice(0,2)==='on' && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(c)); }
  return el;
}

/* which apps can this person open */
function allowed(appKey){
  const me = state.me; if(!me) return false;
  if(me.is_admin) return true;
  const mode = state.access[appKey] || 'assigned';
  if(mode==='off') return false;
  if(mode==='free') return true;
  const app = APPS.find(a=>a.key===appKey);
  return !!(app && me[app.flag]);
}

/* ============================================================= views */
function show(view){
  $('#boot').classList.add('hidden');
  for(const id of ['login','shell','frame']) $('#'+id).classList.toggle('hidden', id!==view);
}

function renderHome(){
  $('#admin').classList.add('hidden'); $('#home').classList.remove('hidden');
  const me = state.me;
  $('#whoBadge').textContent = me.is_admin ? 'Admin' : (me.is_manager ? 'Manager' : (me.gasOnly ? 'Gas' : 'Staff'));
  $('#hello').innerHTML = 'Hi, '+esc((me.name||'').split(' ')[0]||me.employee_code)+'.'
    + '<small>'+esc(hint())+'</small>';
  const tiles = $('#tiles'); tiles.innerHTML='';
  const list = APPS.filter(a => allowed(a.key) || me.is_admin);
  let shown = 0;
  for(const a of APPS){
    const can = allowed(a.key);
    if(!can && !me.is_admin) continue;           // hidden for non-admins
    if(!can && me.is_admin && (state.access[a.key]==='off')) {/* admin still sees, marked */}
    shown++;
    const t = document.createElement('button');
    t.className = 'tile' + (can?'':' locked');
    t.innerHTML =
      '<div class="ic" style="background:'+a.tint+'">'+svg(ICON[a.key])+'</div>'
      + '<div class="t">'+esc(a.title)+'</div>'
      + '<div class="d">'+esc(a.sub)+'</div>'
      + '<div class="go">'+(can?'Open ›':'Locked')+'</div>'
      + (can?'':'<span class="locktag">'+(me.is_admin?'off':'no access')+'</span>');
    t.onclick = ()=> can ? openApp(a) : flash('You don’t have access to '+a.title);
    tiles.appendChild(t);
  }
  $('#adminBtn').classList.toggle('hidden', !me.is_admin);
  $('#noapps').classList.toggle('hidden', shown>0);
}
function hint(){
  const n = APPS.filter(a=>allowed(a.key)).length;
  if(state.me.is_admin) return 'You have full access. Use the ⚙ button at the top to set what each person can open.';
  return n ? 'Tap an app to open it.' : '';
}
function svg(inner){ return '<svg width="24" height="24" viewBox="0 0 24 24">'+inner+'</svg>'; }

/* open an app in the in-shell frame */
let lastScroll=0;
function openApp(a){
  state.api.log('open_app', a.key);
  $('#frameTitle').textContent = a.title;
  $('#frameApp').src = a.src;
  show('frame');
  location.hash = a.key;
}
$('#frameBack').onclick = ()=>{ $('#frameApp').src='about:blank'; history.replaceState(null,'',location.pathname); show('shell'); renderHome(); };

/* ============================================================= admin console */
function openAdmin(){ location.hash='admin'; renderAdmin(); }
async function renderAdmin(){
  $('#home').classList.add('hidden'); const box=$('#admin'); box.classList.remove('hidden');
  box.innerHTML = '<div class="panel"><div class="spin"></div></div>';
  try{
    if(!state.staff.length) state.staff = await state.api.staff();
    if(!state.stores.length) state.stores = await state.api.stores();
  }catch(e){ box.innerHTML='<div class="panel">Couldn’t load staff: '+esc(e.message)+'</div>'; return; }
  const storeName = id => (state.stores.find(s=>s.id===id)||{}).name || '—';

  // --- app access modes ---
  const modeNames = { free:'Everyone', assigned:'Only who I tick', off:'Hidden' };
  let modesHtml = APPS.map(a=>{
    const m = state.access[a.key]||'assigned';
    return '<div class="mode"><b>'+esc(a.title)+'</b>'
      + '<select data-mode="'+a.key+'">'
      + ['free','assigned','off'].map(k=>'<option value="'+k+'"'+(k===m?' selected':'')+'>'+modeNames[k]+'</option>').join('')
      + '</select></div>';
  }).join('');

  // --- staff table ---
  const cols = APPS.map(a=>a); // gas, cash, docs, rota + files extra
  const head = '<tr><th>Person</th><th>Store</th>'
    + '<th class="c">Rota</th><th class="c">Gas</th><th class="c">Cash</th><th class="c">Docs</th><th class="c">Files</th>'
    + '<th class="c">Role</th><th class="c">Active</th><th class="c">Manage</th></tr>';
  const rows = state.staff.map(e=>{
    const sw=(field)=> '<label class="sw"><input type="checkbox" data-emp="'+e.id+'" data-field="'+field+'"'
      +(e[field]?' checked':'')+(e.is_admin?' disabled':'')+'><span></span></label>';
    const role = '<select class="rolepick" data-emp="'+e.id+'" data-role="1"'+(e.id===state.me.id?' disabled':'')+'>'
      + [['staff','Staff'],['manager','Manager'],['admin','Admin']].map(([v,l])=>{
          const cur = e.is_admin?'admin':(e.is_manager?'manager':'staff');
          return '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+l+'</option>'; }).join('')
      + '</select>';
    return '<tr class="'+(e.active?'':'off')+'">'
      + '<td><div class="who2">'+esc(e.name||e.employee_code)+'<small>'+esc(e.employee_code)+(e.auth_user_id?'':' · no login yet')+'</small></div></td>'
      + '<td>'+esc(storeName(e.store_id))+'</td>'
      + '<td class="c">'+sw('can_see_rota')+'</td>'
      + '<td class="c">'+sw('can_see_gas')+'</td>'
      + '<td class="c">'+sw('can_see_cash')+'</td>'
      + '<td class="c">'+sw('can_see_docs')+'</td>'
      + '<td class="c">'+sw('can_see_files')+'</td>'
      + '<td class="c">'+role+'</td>'
      + '<td class="c"><label class="sw"><input type="checkbox" data-emp="'+e.id+'" data-field="active"'+(e.active?' checked':'')+(e.id===state.me.id?' disabled':'')+'><span></span></label></td>'
      + '<td class="c"><button class="mbtn" data-manage="'+e.id+'"'+(e.id===state.me.id?' disabled':'')+'>Manage</button></td>'
      + '</tr>';
  }).join('');

  box.innerHTML =
    '<div class="segbtns"><button class="on" id="backApps">‹ Apps</button></div>'
    + '<div class="panel"><h2>App access</h2><p class="note">“Everyone” = any signed-in person. “Only who I tick” = just the people switched on below. “Hidden” = nobody (you still see it).</p>'
    + '<div class="modes">'+modesHtml+'</div></div>'
    + '<div class="panel"><h2>Your sign-in email</h2><p class="note">Add your email and you can sign in with either your login code or this email (same PIN).</p>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="myEmail" type="email" style="flex:1;min-width:200px" placeholder="you@example.com" value="'+esc(state.me.email||'')+'"><button class="mbtn" id="saveEmail">Save</button></div></div>'
    + '<div class="panel"><h2>Gas staff</h2><p class="note">Gas Deliveries keeps its own staff list. Give a person the <b>same login code and PIN</b> there and they sign in once here and Gas opens by itself. Someone who only has a Gas login can sign in here too and will see just Gas.</p>'
    + '<button class="mbtn" id="openGasStaff">Open Gas staff list</button></div>'
    + '<div class="panel"><h2>People</h2><p class="note">Switch on the apps each person can open. Admins always see everything. Cash and Files also control what shows inside Rota.</p>'
    + '<div class="scrollx"><table class="tbl"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div></div>';

  $('#backApps').onclick = ()=>{ location.hash=''; renderHome(); };
  $('#openGasStaff').onclick = ()=> openApp(APPS.find(a=>a.key==='gas'));
  $('#saveEmail').onclick = async ()=>{ const v=$('#myEmail').value.trim().toLowerCase();
    try{ await state.api.updateEmployee(state.me.id, { email: v||null }); state.me.email=v; flash('Saved'); }catch(e){ flash('Not saved: '+e.message); } };

  box.querySelectorAll('select[data-mode]').forEach(sel=> sel.onchange = async ()=>{
    state.access[sel.dataset.mode] = sel.value;
    try{ await state.api.setAppAccess(state.access); flash('Saved'); }catch(e){ flash('Not saved: '+e.message); }
  });
  box.querySelectorAll('input[data-field]').forEach(cb=> cb.onchange = async ()=>{
    const emp = state.staff.find(x=>x.id===cb.dataset.emp); const field=cb.dataset.field;
    emp[field]=cb.checked;
    try{ await state.api.updateEmployee(emp.id, { [field]: cb.checked }); flash('Saved'); }
    catch(e){ cb.checked=!cb.checked; emp[field]=cb.checked; flash('Not saved: '+e.message); }
  });
  box.querySelectorAll('select[data-role]').forEach(sel=> sel.onchange = async ()=>{
    const emp = state.staff.find(x=>x.id===sel.dataset.emp);
    const patch = { is_admin: sel.value==='admin', is_manager: sel.value==='manager'||sel.value==='admin' };
    try{ await state.api.updateEmployee(emp.id, patch); Object.assign(emp,patch); flash('Saved'); }
    catch(e){ flash('Not saved: '+e.message); }
  });
  box.querySelectorAll('button[data-manage]').forEach(btn=> btn.onclick = ()=> manage(state.staff.find(x=>x.id===btn.dataset.manage)));
}

/* per-person manage sheet: PIN, deactivate/restore, delete */
function manage(emp){
  if(!emp) return;
  const hasPin = !!emp.auth_user_id;
  const sheet = h('div', { class:'modal' },
    h('div', { class:'sheet' },
      h('div', { class:'sheethead' }, h('b', null, emp.name||emp.employee_code),
        h('button', { class:'x', html:'✕', onclick:close })),
      h('div', { class:'mstat' }, emp.active ? 'Active' : 'Deactivated',
        ' · ', hasPin ? 'has a login PIN' : 'no login yet',
        ' · code ', h('b', null, emp.employee_code)),
      h('div', { class:'mactions' },
        mbtn(hasPin?'Reset PIN':'Set a PIN', 'accent', async ()=>{
          const pin = await askPin(emp); if(pin==null) return;
          await op('set_pin', emp, pin, (hasPin?'PIN reset for ':'Login set up for ')+(emp.name||emp.employee_code));
        }),
        hasPin ? mbtn('Remove PIN (old PIN stops working)', 'ghost', ()=> op('remove_pin', emp, null, 'PIN removed — '+(emp.name||emp.employee_code)+' can’t sign in until you set a new one')) : null,
        emp.active
          ? mbtn('Remove (deactivate — keeps history, undoable)', 'warn', ()=> op('deactivate', emp, null, (emp.name||emp.employee_code)+' removed. Use Restore to undo.'))
          : mbtn('Restore (undo removal)', 'good', ()=> op('restore', emp, null, (emp.name||emp.employee_code)+' restored.')),
        h('div', { class:'mdiv' }),
        mbtn('Delete permanently', 'bad', async ()=>{
          const okDel = await confirmDelete(emp); if(!okDel) return;
          await op('delete_permanent', emp, null, (emp.name||emp.employee_code)+' permanently deleted');
        }),
        h('p', { class:'note', style:{marginTop:'4px'} }, 'Deleting erases this person and their shifts and requests. Their past entries stay in reports but show no name. This can’t be undone — “Remove” is the safe, reversible option.')
      )
    )
  );
  document.body.appendChild(sheet);
  function close(){ sheet.remove(); }
  async function op(action, emp, pin, okMsg){
    sheet.querySelectorAll('button').forEach(b=> b.disabled=true);
    try{
      await state.api.staffOp(action, emp.id, pin);
      flash(okMsg||'Done');
      state.staff = await state.api.staff();   // refresh
      close(); renderAdmin();
    }catch(e){ flash('Didn’t work: '+e.message); sheet.querySelectorAll('button').forEach(b=> b.disabled=false); }
  }
}
function mbtn(label, kind, onclick){ return h('button', { class:'mrow '+kind, onclick }, label); }
function askPin(emp){
  return new Promise(res=>{
    const m = h('div', { class:'modal' }, h('div', { class:'sheet' },
      h('div', { class:'sheethead' }, h('b', null, 'PIN for '+(emp.name||emp.employee_code)), h('button', { class:'x', html:'✕', onclick:()=>{m.remove();res(null)} })),
      h('p', { class:'note' }, 'Enter a PIN of at least 4 digits. Share it with them privately — they sign in with code “'+esc(emp.employee_code)+'” and this PIN.'),
      h('input', { id:'pinIn', type:'text', inputmode:'numeric', placeholder:'e.g. 4821', style:{marginTop:'8px'} }),
      h('div', { class:'mactions' },
        h('button', { class:'mrow accent', onclick:()=>{ const v=m.querySelector('#pinIn').value.trim(); if(!/^\d{4,}$/.test(v)){ m.querySelector('#pinIn').style.borderColor='var(--bad)'; return; } m.remove(); res(v); } }, 'Save PIN'))
    ));
    document.body.appendChild(m); setTimeout(()=>m.querySelector('#pinIn').focus(),50);
  });
}
function confirmDelete(emp){
  return new Promise(res=>{
    const m = h('div', { class:'modal' }, h('div', { class:'sheet' },
      h('div', { class:'sheethead' }, h('b', null, 'Delete '+(emp.name||emp.employee_code)+'?'), h('button', { class:'x', html:'✕', onclick:()=>{m.remove();res(false)} })),
      h('p', { class:'note' }, 'This permanently removes them and their shifts and requests. To confirm, type DELETE.'),
      h('input', { id:'delIn', placeholder:'DELETE', style:{marginTop:'8px'} }),
      h('div', { class:'mactions' },
        h('button', { class:'mrow bad', onclick:()=>{ if(m.querySelector('#delIn').value.trim().toUpperCase()!=='DELETE') return; m.remove(); res(true); } }, 'Delete permanently'),
        h('button', { class:'mrow ghost', onclick:()=>{m.remove();res(false)} }, 'Cancel'))
    ));
    document.body.appendChild(m); setTimeout(()=>m.querySelector('#delIn').focus(),50);
  });
}

/* ============================================================= boot */
function enterGasOnly(code){
  state.me = { id:null, gasOnly:true, name:code, employee_code:code, can_see_gas:true };
  state.access = { gas:'assigned', rota:'off', cash:'off', docs:'off' };
  show('shell'); routeHash();
}
async function loadProfileAndRender(){
  const user = await state.api.getUser();
  if(!user){
    let g=null; try{ g = sessionStorage.getItem('rw_gasonly'); }catch(e){}
    if(g){ enterGasOnly(g); return; }
    show('login'); return;
  }
  let me; try{ me = await state.api.profile(user.id); }catch(e){ me=null; }
  if(!me){
    // signed in but no employee record linked
    show('login');
    $('#loginErr').textContent = 'No employee profile is linked to this login yet. Ask your manager to set it up.';
    $('#loginErr').classList.remove('hidden');
    await state.api.signOut();
    return;
  }
  state.me = me;
  state.access = await state.api.appAccess();
  state.api.log('hub_open', null);
  show('shell'); routeHash();
}
function routeHash(){
  const h = (location.hash||'').replace('#','');
  if(h==='admin' && state.me.is_admin){ renderAdmin(); return; }
  const app = APPS.find(a=>a.key===h);
  if(app && allowed(app.key)){ openApp(app); return; }
  renderHome();
}

$('#loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=$('#loginBtn'), code=$('#code').value, pin=$('#pin').value;
  $('#loginErr').classList.add('hidden');
  if(!code||!pin) return;
  btn.disabled=true; btn.innerHTML='<span class="spin" style="width:18px;height:18px;border-width:2px"></span> Signing in…';
  const res = await state.api.signIn(code, pin); const error = res.error;
  btn.disabled=false; btn.textContent='Sign in';
  const plain = code.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  // hand the same code + PIN to Gas (this tab only) so it signs in by itself when opened
  const stash = c => { try{ sessionStorage.setItem('rw_sso', JSON.stringify({ code:c, pin:String(pin), t:Date.now() })); }catch(e){} };
  if(error && !code.includes('@') && plain && state.api.gasHasLogin && await state.api.gasHasLogin(plain)){
    // not in the Rotawise staff list, but has a Gas login: open the hub with Gas only
    stash(plain); try{ sessionStorage.setItem('rw_gasonly', plain); }catch(e){}
    enterGasOnly(plain); return;
  }
  if(!error) stash(res.code || plain);
  if(error){
    const msg = /Invalid login credentials/i.test(error) ? 'That code or PIN isn’t right. Check with your manager.' : error;
    $('#loginErr').textContent = msg; $('#loginErr').classList.remove('hidden'); return;
  }
  await loadProfileAndRender();
});
$('#logoutBtn').onclick = async ()=>{ try{ sessionStorage.removeItem('rw_gasonly'); sessionStorage.removeItem('rw_sso'); }catch(e){} await state.api.signOut(); state.me=null; location.hash=''; show('login'); $('#pin').value=''; };
$('#themeBtn').onclick = flipTheme;
$('#adminBtn').onclick = ()=> openAdmin();
window.addEventListener('hashchange', ()=>{ if(!$('#shell').classList.contains('hidden')) routeHash(); });

(async function init(){
  theme();
  // Preview mode: when served from /hub/, Rota still lives at the site root.
  // After go-live the hub is at the root and Rota moves to /rota/.
  const atPreview = location.pathname.replace(/\/+$/,'').endsWith('/hub');
  if(atPreview){ for(const a of APPS){ a.src = a.src.replace('/rota/','/').replace('/gas/','/gas/').replace('/sheaf/','/sheaf/'); } }
  state.api = window.RW_API || makeSupabaseApi();
  try{ await loadProfileAndRender(); }
  catch(e){ show('login'); $('#loginErr').textContent='Couldn’t reach the server. Check your connection.'; $('#loginErr').classList.remove('hidden'); }
})();
</script>
