<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotawise</title>
<meta name="theme-color" content="#14273D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314273D'/%3E%3Cpath d='M9 22V10h6a4 4 0 0 1 1 7.9L19 22h-3l-2.6-4H12v4H9zm3-6.6h2.6a1.6 1.6 0 0 0 0-3.2H12z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#14273D; --navy2:#1d3a5c; --ink:#14273D; --muted:#5b6b7f; --line:#e4e9f0;
  --bg:#eef1f6; --card:#ffffff; --accent:#2b5ce6; --good:#1f9d61; --bad:#d8453c; --warn:#c77d12;
  --r:18px; --sh:0 1px 2px rgba(20,39,61,.06),0 8px 24px rgba(20,39,61,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --navy:#0f1d2e; --ink:#eaf1fb; --muted:#9db0c6; --line:#24344a; --bg:#0b141f; --card:#132233;
    --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme=dark]{
  --navy:#0f1d2e; --ink:#eaf1fb; --muted:#9db0c6; --line:#24344a; --bg:#0b141f; --card:#132233;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
#login,#shops{min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%, #1d3a5c 0%, var(--navy) 60%)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);width:100%;max-width:400px;padding:28px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .mark{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:800}
.brand h1{font-size:22px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:2px 0 20px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,92,230,.15)}
.btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--line)}
.linkbtn{display:block;width:100%;margin-top:14px;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:6px}
.shopbtn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;margin-top:9px;font-weight:650;font-size:16px}
.shopbtn:hover{border-color:var(--accent)}
.shopbtn .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.shopbtn .st.open{color:#17754a;background:#e6f6ee;border-color:#bfe6d0}
.shoplist-empty{color:var(--muted);font-size:14px;margin:6px 0 4px}
.shopmode{display:flex;gap:6px;flex-wrap:wrap}
.shopmode button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.shopmode button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn:disabled{opacity:.6}
.err{background:#fdeceb;color:#9a2a23;border-radius:11px;padding:11px 13px;font-size:14px;margin-top:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .err{background:#3a1f1d;color:#ffb4ad}}

/* ---------- shell ---------- */
#shell{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.top .mark{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.top .who .badge{background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px}
.icbtn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.wrap{max-width:960px;margin:0 auto;width:100%;padding:22px 16px 60px}
.hello{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.hello small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:22px}
.tile{position:relative;border:0;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:18px;display:flex;flex-direction:column;gap:10px;min-height:150px;color:var(--ink);transition:transform .12s ease, box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,39,61,.1),0 18px 40px rgba(20,39,61,.12)}
.tile .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff}
.tile .t{font-size:18px;font-weight:750;letter-spacing:-.01em}
.tile .d{font-size:13.5px;color:var(--muted);margin-top:-4px}
.tile .go{margin-top:auto;font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.tile.locked{opacity:.55;filter:grayscale(.3)}
.tile .locktag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.empty{margin-top:30px;color:var(--muted);text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- app frame ---------- */
#frame{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.fbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 9px) 12px 9px}
.fbar .back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:7px}
.fbar .ft{font-weight:700}
#frame iframe{flex:1;border:0;width:100%;background:var(--card)}

/* ---------- admin ---------- */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:18px}
.panel h2{margin:0 0 4px;font-size:17px}
.panel p.note{color:var(--muted);font-size:13px;margin:0 0 14px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mode b{font-size:14px}
.mode select{margin-top:7px;padding:8px}
.tbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.off td{opacity:.5}
.who2{display:flex;flex-direction:column}
.who2 small{color:var(--muted)}
.sw{position:relative;display:inline-block;width:40px;height:24px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--good)}
.sw input:checked+span:before{transform:translateX(16px)}
.rolepick{padding:6px 8px;border-radius:9px;font-size:13px}
.save-flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--sh);z-index:60;opacity:0;transition:opacity .2s}
.save-flash.show{opacity:1}
.scrollx{overflow-x:auto}
.mbtn{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,32,.5);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:16px;box-shadow:var(--sh);width:100%;max-width:420px;padding:18px;max-height:90vh;overflow:auto}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sheethead b{font-size:17px}
.sheethead .x{margin-left:auto;background:var(--bg);border:0;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:15px}
.mstat{color:var(--muted);font-size:13px;margin-bottom:14px}
.mactions{display:flex;flex-direction:column;gap:9px}
.mrow{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:12px 14px;font-weight:600;font-size:14.5px}
.mrow.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.mrow.good{background:var(--good);color:#fff;border-color:var(--good)}
.mrow.warn{border-color:var(--warn);color:var(--warn)}
.mrow.bad{border-color:var(--bad);color:var(--bad)}
.mrow.ghost{color:var(--muted)}
.mrow:disabled{opacity:.55}
.mdiv{height:1px;background:var(--line);margin:4px 0}
.segbtns{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.segbtns button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.segbtns button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.banner{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px}.banner span{flex:1 1 220px}
</style>
</head>
<body>

<div id="boot" style="min-height:100%;display:grid;place-items:center"><div class="spin"></div></div>

<!-- SHOPS -->
<section id="shops" class="hidden">
  <div class="card" style="max-width:460px">
    <div class="brand"><div class="mark">R</div><h1>Rotawise</h1></div>
    <div class="sub">Free for every shop. Pick yours, or create one.</div>
    <div id="shopList"></div>
    <div id="shopErr" class="err hidden"></div>
    <button class="btn alt" id="newShopBtn" type="button">+ Create a new shop</button>
    <button class="linkbtn" id="personalBtn" type="button">Staff or admin? Sign in with your own login</button>
    <button class="linkbtn" id="homeBtn" type="button">‹ Back to the free apps</button>
  </div>
</section>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand"><div class="mark">R</div><h1>Rotawise</h1></div>
    <div class="sub">Staff: your login code and PIN. Admin: your email and password.</div>
    <label for="code">Login code or email</label>
    <input id="code" name="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Your login code, or your email" required>
    <label for="pin">PIN or password</label>
    <input id="pin" name="password" type="password" placeholder="PIN or password" required>
    <div id="loginErr" class="err hidden"></div>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
    <button class="linkbtn" id="toShops" type="button">‹ Back to the shop list</button>
  </form>
</section>

<!-- SHELL -->
<section id="shell" class="hidden">
  <header class="top">
    <div class="mark">R</div><h1>Rotawise</h1>
    <div class="who">
      <span class="badge" id="whoBadge"></span>
      <button class="icbtn hidden" id="adminBtn" title="Admin: people & access">⚙</button>
      <button class="icbtn" id="themeBtn" title="Light / dark">◐</button>
      <button class="icbtn" id="logoutBtn" title="Sign out">⎋</button>
    </div>
  </header>
  <div class="wrap">
    <div id="home">
      <div class="hello" id="hello"></div>
      <div class="banner hidden" id="banner"></div>
      <div class="grid" id="tiles"></div>
      <div class="empty hidden" id="noapps">No apps have been shared with you yet. Ask your manager to grant access.</div>
    </div>
    <div id="admin" class="hidden"></div>
  </div>
</section>

<!-- APP FRAME -->
<section id="frame" class="hidden">
  <div class="fbar">
    <button class="back" id="frameBack">‹ Apps</button>
    <span class="ft" id="frameTitle"></span>
  </div>
  <iframe id="frameApp" title="App" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
</section>

<div class="save-flash" id="flash"></div>

<script>
/* ============================================================= config
   Rotawise hub, on Firebase (free plan). Shops: anyone can create one and use every app for free;
   a shop stays open to anyone until it sets a password. The admin sees every shop and its password. */
const BUILD = '2026.11.14-fb1';
const FB_MODULE = '/fb/rw.js';

const ICON = {
  rota:'<path d="M7 4v3M17 4v3M4 9h16M5 7h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  gas:'<path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-1.7.8-3.3 1.7-4.5C9.7 8.8 12 7 12 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  cash:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M9.5 10.2c0-1 1.1-1.7 2.5-1.7s2.5.6 2.5 1.7-1 1.5-2.5 1.8-2.5.8-2.5 1.9 1.1 1.6 2.5 1.6 2.5-.6 2.5-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  docs:'<path d="M7 3h6l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13 3v4h4M9 13h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  orders:'<path d="M4 5h2l2 10h9l2-7H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19" r="1.5" fill="currentColor"/><circle cx="16.5" cy="19" r="1.5" fill="currentColor"/>'
};
// key, title, subtitle, where it opens for the business / for a shop (null = not ready for shops yet), tint
const APPS = [
  { key:'rota',   title:'Rota',           sub:'Shifts, attendance & leave',    src:'/',         shopSrc:null,       tint:'#2b5ce6' },
  { key:'gas',    title:'Gas Deliveries', sub:'Orders, stock & rounds',        src:'/gas/',     shopSrc:'/gas/',    tint:'#e8743b' },
  { key:'cash',   title:'Cash Up',        sub:'Daily cash reconciliation',     src:'/#cash',    shopSrc:null,       tint:'#1f9d61' },
  { key:'orders', title:'Goods Orders',   sub:'What to order, stock & levels', src:'/orders/',  shopSrc:'/orders/', tint:'#0e9aa7' },
  { key:'docs',   title:'Documents',      sub:'Scan, merge, edit & sign files', src:'/sheaf/',  shopSrc:'/sheaf/',  tint:'#7a5af8' },
];
const DEFAULT_ON = { rota:true, gas:true, cash:false, orders:true, docs:true };   // for staff nobody has ticked yet

/* ============================================================= data layer
   Talks to Firebase through /fb/rw.js. Tests replace window.RW_API. */
async function makeFirebaseApi(){
  const rw = await import(FB_MODULE);
  const toMe = w => {
    if(!w) return null;
    if(w.kind==='off') return { off:true };
    if(w.kind==='shop') return { id:w.uid, is_shop:true, is_manager:true, shopId:w.shopId, shopName:w.name, shopAccess:w.access, shopHidden:w.hidden, name:w.name, apps:{ rota:1, gas:1, cash:1, orders:1, docs:1 } };
    if(w.kind==='admin') return { id:w.uid, is_admin:true, is_manager:true, name:'Admin', employee_code:'admin', email:w.email };
    const apps={}; for(const a of APPS) apps[a.key] = w.apps && a.key in w.apps ? !!w.apps[a.key] : DEFAULT_ON[a.key];
    return { id:w.uid, name:w.name, employee_code:w.code, is_admin:w.admin, is_manager:w.manager, role:w.role, apps };
  };
  return {
    async whoami(){ return toMe(await rw.whoami()); },
    signInPerson: rw.signInPerson, signOut: rw.signOut,
    shops: rw.listShops, enterShop: rw.enterShop, createShop: rw.createShop,
    setShopAccess: rw.setShopAccess, renameShop: rw.renameShop, hideShop: rw.hideShop,
    adminShops: rw.adminShops, myShopKey: rw.myShopKey,
    appModes: rw.appModes, setAppModes: rw.setAppModes,
    async staff(){ return (await rw.staffList()).map(x=>({ id:x.id, name:x.name||x.code, employee_code:x.code, role:x.role||'staff', active:x.active===true,
      apps:Object.fromEntries(APPS.map(a=>[a.key, x.apps && a.key in x.apps ? !!x.apps[a.key] : DEFAULT_ON[a.key]])) })); },
    setStaffApps: rw.setStaffApps
  };
}

/* ============================================================= state + helpers */
const $ = s => document.querySelector(s);
const state = { api:null, me:null, access:{}, staff:[] };

function theme(){ try{ const t = localStorage.getItem('rw_theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){} }
function flipTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  const next = cur==='dark' ? 'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('rw_theme', next); }catch(e){}
}
function flash(msg){ const f=$('#flash'); f.textContent=msg; f.classList.add('show'); clearTimeout(flash.t); flash.t=setTimeout(()=>f.classList.remove('show'),1800); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){ const v = attrs[k];
    if(v==null||v===false) continue;
    else if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k==='style' && typeof v==='object') Object.assign(el.style, v);
    else if(k.slice(0,2)==='on' && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='checked') el.checked=!!v;
    else el.setAttribute(k, v===true?'':v);
  }
  for(const c of kids.flat(3)){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(c)); }
  return el;
}
const lsSet=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };

/* which apps can this person open */
function srcFor(a){ return state.me && (state.me.is_shop || state.me.guest) ? a.shopSrc : a.src; }
function allowed(key){
  const me = state.me; if(!me) return false;
  const a = APPS.find(x=>x.key===key); if(!a || !srcFor(a)) return false;
  if(me.is_admin || me.is_shop || me.guest) return true;
  const mode = state.access[key] || 'assigned';
  if(mode==='off') return false;
  if(mode==='free') return true;
  return !!(me.apps && me.apps[key]);
}

/* ============================================================= views */
function show(view){
  $('#boot').classList.add('hidden');
  for(const id of ['shops','login','shell','frame']) $('#'+id).classList.toggle('hidden', id!==view);
}
function renderHome(){
  $('#admin').classList.add('hidden'); $('#home').classList.remove('hidden');
  const me = state.me;
  $('#whoBadge').textContent = me.guest ? 'Free' : me.is_shop ? (me.shopAccess==='password' ? 'Shop · password' : 'Shop · open') : me.is_admin ? 'Admin' : (me.is_manager ? 'Manager' : 'Staff');
  $('#logoutBtn').title = me.guest ? 'Pick a shop or sign in' : me.is_shop ? 'Switch shop' : 'Sign out';
  $('#adminBtn').title = me.is_shop ? 'Shop settings: name & password' : 'Admin: shops, people & access';
  $('#adminBtn').classList.toggle('hidden', !(me.is_admin || me.is_shop));
  $('#hello').innerHTML = (me.guest ? 'Welcome to Rotawise' : me.is_shop ? esc(me.shopName) : 'Hi, '+esc(String(me.name||'').split(' ')[0]||me.employee_code)+'.')
    + '<small>'+esc(hint())+'</small>';
  const tiles = $('#tiles'); tiles.innerHTML='';
  const bn = $('#banner'); bn.replaceChildren(); bn.classList.add('hidden');
  if(me.guest){ bn.classList.remove('hidden'); bn.append(h('span',null,'Already have a shop, or a staff login?'), h('button',{ class:'mbtn', id:'bnPick', onclick:()=>showShops(false) }, 'Pick a shop'), h('button',{ class:'mbtn', id:'bnLogin', onclick:()=>$('#personalBtn').click() }, 'Sign in')); }
  else if(me.is_shop && (me.shopHidden || me.shopAccess==='open')){ bn.classList.remove('hidden');
    bn.append(h('span',null, me.shopHidden ? 'Your data is saved here. Give your shop a name so you can find it again, and add a password whenever you want to keep it private.' : 'Anyone with the link can open this shop. Add a password when you want to keep it private.'),
      me.shopHidden ? h('button',{ class:'mbtn', id:'bnName', onclick:renameMine }, 'Name my shop') : null,
      h('button',{ class:'mbtn', id:'bnPw', onclick:setMyPw }, 'Add a password')); }
  let shown = 0;
  for(const a of APPS){
    const can = allowed(a.key), soon = !srcFor(a);
    if(!can && !soon && !me.is_admin) continue;
    shown++;
    const t = document.createElement('button');
    t.className = 'tile' + (can?'':' locked');
    t.innerHTML = '<div class="ic" style="background:'+a.tint+'">'+svg(ICON[a.key])+'</div>'
      + '<div class="t">'+esc(a.title)+'</div><div class="d">'+esc(a.sub)+'</div>'
      + '<div class="go">'+(can?'Open ›':soon?'Coming soon':'Locked')+'</div>'
      + (can?'':'<span class="locktag">'+(soon?'soon':me.is_admin?'off':'no access')+'</span>');
    t.onclick = ()=> can ? openApp(a) : flash(soon ? a.title+' for new shops is being moved to the free system. Coming soon.' : 'You don’t have access to '+a.title);
    tiles.appendChild(t);
  }
  $('#noapps').classList.toggle('hidden', shown>0);
}
function hint(){
  const me = state.me;
  if(me.guest) return 'Everything is free. Tap an app and start: no sign-up, no password.';
  if(me.is_shop) return me.shopAccess==='password' ? 'Only people with the shop password can open this shop. Tap ⚙ to change it.' : 'Anyone with the link can open this shop. Tap ⚙ to add a password.';
  if(me.is_admin) return 'You see every shop. Use ⚙ for shops, passwords and who can open what.';
  return APPS.some(a=>allowed(a.key)) ? 'Tap an app to open it.' : '';
}
function svg(inner){ return '<svg width="24" height="24" viewBox="0 0 24 24">'+inner+'</svg>'; }

async function openApp(a){
  if(state.me && state.me.guest && a.key!=='docs'){ if(!await makeFreeSpace()) return; }
  $('#frameTitle').textContent = a.title;
  $('#frameApp').src = srcFor(a);
  show('frame');
  location.hash = a.key;
}
$('#frameBack').onclick = ()=>{ $('#frameApp').src='about:blank'; history.replaceState(null,'',location.pathname); show('shell'); renderHome(); };

/* a free, unnamed shop made the moment a visitor opens an app that saves data */
async function makeFreeSpace(){
  flash('Setting up your free space…');
  for(let i=0;i<3;i++){
    try{
      const r = await state.api.createShop('My shop '+String(Math.floor(1000+Math.random()*9000)), undefined, { hidden:true });
      lsSet('rw_shop', r.id); const me = await state.api.whoami(); if(me && me.is_shop){ state.me = me; state.access = {}; return true; }
    }catch(e){ if(!/already a shop/.test(e.message)){ flash('Couldn’t start: '+e.message); return false; } }
  }
  flash('Couldn’t start. Try again.'); return false;
}
async function renameMine(){
  const me=state.me; const v = await askText('Name your shop', 'This is the name in the shop list.', 'Shop name', 'text', me.shopHidden?'':me.shopName); if(!v) return;
  try{ await state.api.renameShop(me.shopId, v); me.shopName=v; me.name=v; me.shopHidden=false; flash('Saved'); renderHome(); }catch(e){ flash(e.message); }
}
async function setMyPw(){
  const me=state.me; const v = await askText('Add a shop password', 'At least 4 characters. Staff type it once on each phone. Your admin can always see it.', 'Shop password'); if(v==null) return;
  if(v.length<4){ flash('At least 4 characters'); return; }
  try{ await state.api.setShopAccess(me.shopId,'password',v); me.shopAccess='password'; flash('Password set'); renderHome(); }catch(e){ flash('Not saved: '+e.message); }
}

/* ============================================================= small dialogs */
function askText(title, note, ph, type, value){
  return new Promise(res=>{
    const inp = h('input',{ id:'askIn', type:type||'text', placeholder:ph||'', value:value||'', style:{ marginTop:'8px' } });
    const done = v => { m.remove(); res(v); };
    const m = h('div',{ class:'modal' }, h('div',{ class:'sheet' },
      h('div',{ class:'sheethead' }, h('b',null,title), h('button',{ class:'x', html:'✕', onclick:()=>done(null) })),
      note?h('p',{ class:'note' }, note):null, inp,
      h('div',{ class:'mactions', style:{ marginTop:'10px' } }, h('button',{ class:'mrow accent', id:'askOk', onclick:()=>done(inp.value.trim()) }, 'OK'))));
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') done(inp.value.trim()); });
    document.body.appendChild(m); setTimeout(()=>inp.focus(),50);
  });
}
function askYes(title, note, yes){
  return new Promise(res=>{
    const done = v => { m.remove(); res(v); };
    const m = h('div',{ class:'modal' }, h('div',{ class:'sheet' },
      h('div',{ class:'sheethead' }, h('b',null,title), h('button',{ class:'x', html:'✕', onclick:()=>done(false) })),
      h('p',{ class:'note' }, note),
      h('div',{ class:'mactions', style:{ marginTop:'10px' } }, h('button',{ class:'mrow accent', id:'yesOk', onclick:()=>done(true) }, yes||'Yes'), h('button',{ class:'mrow ghost', onclick:()=>done(false) }, 'Cancel'))));
    document.body.appendChild(m);
  });
}

/* ============================================================= shop picker (first screen) */
async function showShops(auto){
  show('shops'); $('#shopErr').classList.add('hidden');
  const box=$('#shopList'); box.innerHTML='<div class="spin" style="margin:10px auto"></div>';
  let list=[]; try{ list = await state.api.shops(); }catch(e){ box.textContent=''; shopErr('Couldn’t load the shops. Check your connection.'); return; }
  const last=lsGet('rw_shop');
  const tag={ open:['Open','open'], password:['Password',''] };
  box.replaceChildren(...(list.length?list.map(sh=>h('button',{ class:'shopbtn', 'data-shop':sh.id, onclick:()=>enterShop(sh) }, sh.name, h('span',{ class:'st '+(tag[sh.access]||tag.password)[1] }, (tag[sh.access]||tag.password)[0]))):
    [h('div',{ class:'shoplist-empty' }, 'No shops yet. Create the first one.')]));
}
function shopErr(m){ $('#shopErr').textContent=m; $('#shopErr').classList.remove('hidden'); }
async function enterShop(sh, quiet){
  $('#shopErr').classList.add('hidden');
  try{
    let typed;
    if(sh.access==='password'){
      typed = await askText(sh.name, 'Type the shop password. You only need to do this once on this phone.', 'Shop password', 'password'); if(!typed) return;
    }
    const r = await state.api.enterShop(sh.id, typed);
    if(r.error){ shopErr(r.error==='wrong' ? (sh.access==='password' ? 'That shop password isn’t right.' : 'This shop’s login changed. Pick it again.') : r.error==='locked' ? 'This shop now has a password. Pick it again and type the password.' : r.error);
      if(quiet) await showShops(false); return; }
    lsSet('rw_shop', sh.id);
    await loadProfileAndRender();
  }catch(e){ shopErr('Couldn’t open the shop: '+e.message); }
}
function createShopSheet(fromAdmin){
  return new Promise(resolve=>{
  const nameIn=h('input',{ id:'nsName', placeholder:'Shop name, e.g. Yate Mini Market', style:{ marginTop:'6px' } });
  const pwIn=h('input',{ id:'nsPw', type:'text', autocomplete:'off', placeholder:'Shop password (optional)', style:{ marginTop:'8px' } });
  const err=h('div',{ class:'err hidden' });
  const close=v=>{ m.remove(); resolve(v); };
  const m=h('div',{ class:'modal' }, h('div',{ class:'sheet' },
    h('div',{ class:'sheethead' }, h('b',null,'Create a new shop'), h('button',{ class:'x', html:'✕', onclick:()=>close(null) })),
    h('p',{ class:'note' }, 'Free. The shop gets its own Gas Deliveries, Goods Orders and Documents. Other shops can’t see its data.'),
    nameIn,
    h('p',{ class:'note', style:{ marginTop:'12px' } }, 'No password: anyone with the link can open it. You can add one any time. With a password, staff type it once on each phone.'),
    pwIn, err,
    h('div',{ class:'mactions', style:{ marginTop:'12px' } }, h('button',{ class:'mrow accent', id:'nsGo', onclick:async ev=>{
      const name=nameIn.value.trim(), pw=pwIn.value.trim();
      if(name.length<2){ nameIn.focus(); return; }
      if(pw && pw.length<4){ err.textContent='The shop password needs at least 4 characters.'; err.classList.remove('hidden'); return; }
      ev.target.disabled=true; ev.target.textContent='Creating…';
      try{ const r = await state.api.createShop(name, pw||undefined, { keepSession:!!fromAdmin }); close(r); }
      catch(e){ err.textContent=e.message; err.classList.remove('hidden'); ev.target.disabled=false; ev.target.textContent='Create shop'; }
    } }, 'Create shop'))));
  document.body.appendChild(m); setTimeout(()=>nameIn.focus(),50);
  });
}
$('#newShopBtn').onclick = async ()=>{ const r = await createShopSheet(false); if(!r) return; lsSet('rw_shop', r.id); flash(r.name+' is ready'); await loadProfileAndRender(); };
$('#personalBtn').onclick = ()=>{ show('login'); $('#loginErr').classList.add('hidden'); setTimeout(()=>$('#code').focus(),50); };
$('#toShops').onclick = ()=> showShops(false);
$('#homeBtn').onclick = ()=>{ state.me = { guest:true }; state.access={}; show('shell'); renderHome(); };

/* ============================================================= shop settings (the shop itself) */
async function shopSettings(){
  const me=state.me; let pw=null; try{ pw = await state.api.myShopKey(me.shopId); }catch(e){}
  const m=h('div',{ class:'modal' }, h('div',{ class:'sheet' },
    h('div',{ class:'sheethead' }, h('b',null,me.shopName), h('button',{ class:'x', html:'✕', onclick:()=>m.remove() })),
    h('p',{ class:'note' }, me.shopAccess==='password'
      ? ['Password: ', h('b',{ id:'myPw' }, pw||'—'), '. Staff type it once on each phone. Your admin can always see it.']
      : 'Open: anyone with the link can open this shop and see its data. Add a password to keep it to your staff.'),
    h('div',{ class:'mactions' },
      h('button',{ class:'mrow accent', id:'setPw', onclick:async()=>{ m.remove();
        const v = await askText(me.shopAccess==='password'?'New shop password':'Add a shop password', 'At least 4 characters. Phones already in the shop will be asked for it within the hour.', 'Shop password');
        if(v==null) return; if(v.length<4){ flash('At least 4 characters'); return; }
        try{ await state.api.setShopAccess(me.shopId,'password',v); me.shopAccess='password'; flash('Password set'); renderHome(); }catch(e){ flash('Not saved: '+e.message); } } },
        me.shopAccess==='password'?'Change the password':'Add a password'),
      me.shopAccess==='password' ? h('button',{ class:'mrow ghost', id:'makeOpen', onclick:async()=>{ m.remove();
        if(!await askYes('Open '+me.shopName+' to anyone?', 'Anyone with the link will be able to see and change this shop’s data without a password.', 'Open it')) return;
        try{ await state.api.setShopAccess(me.shopId,'open'); me.shopAccess='open'; flash('Shop is open'); renderHome(); }catch(e){ flash('Not saved: '+e.message); } } }, 'Remove the password (open to anyone)') : null,
      h('button',{ class:'mrow ghost', id:'renameShop', onclick:async()=>{ m.remove();
        const v = await askText('Rename the shop', null, 'Shop name', 'text', me.shopName); if(!v||v===me.shopName) return;
        try{ await state.api.renameShop(me.shopId, v); me.shopName=v; flash('Renamed'); renderHome(); }catch(e){ flash('Not saved: '+e.message); } } }, 'Rename the shop'))));
  document.body.appendChild(m);
}

/* ============================================================= admin console */
function openAdmin(){ if(state.me.is_shop){ shopSettings(); return; } location.hash='admin'; renderAdmin(); }
async function renderAdmin(){
  $('#home').classList.add('hidden'); const box=$('#admin'); box.classList.remove('hidden');
  box.innerHTML = '<div class="panel"><div class="spin"></div></div>';
  const modeNames = { free:'Everyone', assigned:'Only who I tick', off:'Hidden' };
  box.replaceChildren(
    h('div',{ class:'segbtns' }, h('button',{ class:'on', id:'backApps', onclick:()=>{ location.hash=''; renderHome(); } }, '‹ Apps')),
    h('div',{ class:'panel', id:'shopsPanel' }, h('h2',null,'Shops'),
      h('p',{ class:'note' }, 'Every shop anyone has created, with its password. Open shops need no password. Each shop only sees its own data; you see them all.'),
      h('div',{ id:'shopRows' }, h('div',{ class:'spin' })),
      h('button',{ class:'mbtn', id:'adminNewShop', style:{ marginTop:'10px' }, onclick:async()=>{ const r=await createShopSheet(true); if(r){ flash(r.name+' created'); renderShopRows(); } } }, '+ New shop')),
    h('div',{ class:'panel' }, h('h2',null,'App access for your staff'),
      h('p',{ class:'note' }, '“Everyone” = anyone with a staff login. “Only who I tick” = the people switched on below. “Hidden” = nobody but you.'),
      h('div',{ class:'modes' }, APPS.map(a=>h('div',{ class:'mode' }, h('b',null,a.title),
        h('select',{ 'data-mode':a.key, onchange:async ev=>{ state.access[a.key]=ev.target.value; try{ await state.api.setAppModes(state.access); flash('Saved'); }catch(e){ flash('Not saved: '+e.message); } } },
          ['free','assigned','off'].map(k=>h('option',{ value:k, selected:(state.access[a.key]||'assigned')===k?'selected':null }, modeNames[k]))))))),
    h('div',{ class:'panel' }, h('h2',null,'People'),
      h('p',{ class:'note' }, 'Your staff logins (the same login code and PIN work in every app). Add people, change PINs or remove someone in Gas › Settings › Employees.'),
      h('div',{ id:'peopleBox' }, h('div',{ class:'spin' })),
      h('div',{ style:{ display:'flex', gap:'8px', flexWrap:'wrap', marginTop:'10px' } },
        h('button',{ class:'mbtn', id:'openGasStaff', onclick:()=>openApp(APPS.find(a=>a.key==='gas')) }, 'Add or change people (Gas)'),
        h('a',{ class:'mbtn', href:'classic/', style:{ textDecoration:'none' } }, 'Rota staff list (old system)'))));
  renderShopRows(); renderPeople();
}
async function renderShopRows(){
  const box=$('#shopRows'); if(!box) return;
  let list; try{ list=await state.api.adminShops(); }catch(e){ box.textContent='Couldn’t load shops: '+e.message; return; }
  if(!list.length){ box.replaceChildren(h('div',{ class:'note' },'No shops yet.')); return; }
  box.replaceChildren(...list.map(sh=>{
    const pwEl=h('b',{ class:'pw' }, sh.access==='password' ? (sh.pw||'—') : 'none');
    return h('div',{ class:'mode', style:{ marginBottom:'8px', opacity:sh.hidden?.55:1 }, 'data-shop':sh.id },
      h('div',{ style:{ display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap' } }, h('b',null,sh.name),
        h('span',{ class:'note', style:{ margin:0 } }, (sh.access==='open'?'Open':'Password')+(sh.hidden?' · hidden from the list':'')+(sh.createdAt?' · made '+new Date(sh.createdAt).toLocaleDateString('en-GB'):''))),
      h('div',{ class:'note', style:{ margin:'6px 0' } }, 'Password: ', pwEl),
      h('div',{ class:'shopmode' },
        h('button',{ 'data-act':'pw', onclick:()=>adminSetPw(sh) }, sh.access==='password'?'Change password':'Set a password'),
        sh.access==='password' ? h('button',{ 'data-act':'open', onclick:()=>adminOpen(sh) }, 'Make open') : null,
        h('button',{ 'data-act':'rename', onclick:async()=>{ const v=await askText('Rename '+sh.name,null,'Shop name','text',sh.name); if(!v||v===sh.name) return; try{ await state.api.renameShop(sh.id,v); flash('Renamed'); renderShopRows(); }catch(e){ flash('Not saved: '+e.message); } } }, 'Rename'),
        h('button',{ 'data-act':'hide', onclick:async()=>{ try{ await state.api.hideShop(sh.id,!sh.hidden); flash(sh.hidden?'Back in the list':'Hidden from the list'); renderShopRows(); }catch(e){ flash('Not saved: '+e.message); } } }, sh.hidden?'Show in list':'Hide from list'),
        h('button',{ 'data-act':'enter', onclick:()=>enterAsAdmin(sh) }, 'Open this shop')));
  }));
}
async function adminSetPw(sh){
  const v = await askText('Password for '+sh.name, 'At least 4 characters. Phones already in the shop will be asked for it within the hour.', 'Shop password'); if(v==null) return;
  if(v.length<4){ flash('At least 4 characters'); return; }
  try{ await state.api.setShopAccess(sh.id,'password',v); flash('Password set'); renderShopRows(); }catch(e){ flash('Not saved: '+e.message); }
}
async function adminOpen(sh){
  if(!await askYes('Open '+sh.name+' to anyone?', 'Anyone with the link will see and change this shop’s data without a password.', 'Open it')) return;
  try{ await state.api.setShopAccess(sh.id,'open'); flash('Shop is open'); renderShopRows(); }catch(e){ flash('Not saved: '+e.message); }
}
async function enterAsAdmin(sh){
  if(!await askYes('Open '+sh.name+'?', 'You will be signed out of your admin login and into this shop. Sign in again with your email afterwards.', 'Open the shop')) return;
  const pw = sh.access==='password' ? sh.pw : undefined;
  const r = await state.api.enterShop(sh.id, pw);
  if(r.error){ flash('Couldn’t open it: '+r.error); return; }
  lsSet('rw_shop', sh.id); location.hash=''; await loadProfileAndRender();
}
async function renderPeople(){
  const box=$('#peopleBox'); if(!box) return;
  try{ state.staff = await state.api.staff(); }catch(e){ box.textContent='Couldn’t load people: '+e.message; return; }
  if(!state.staff.length){ box.replaceChildren(h('div',{ class:'note' },'No staff logins yet. Add people in Gas › Settings › Employees.')); return; }
  const roles={ staff:'Staff', manager:'Manager', admin:'Admin' };
  box.replaceChildren(h('div',{ class:'scrollx' }, h('table',{ class:'tbl' },
    h('thead',null,h('tr',null,h('th',null,'Person'),APPS.map(a=>h('th',{ class:'c' },a.title.split(' ')[0])),h('th',{ class:'c' },'Role'))),
    h('tbody',null,state.staff.map(e=>h('tr',{ class:e.active?'':'off' },
      h('td',null,h('div',{ class:'who2' },e.name,h('small',null,e.employee_code+(e.active?'':' · switched off')))),
      APPS.map(a=>h('td',{ class:'c' },h('label',{ class:'sw' },h('input',{ type:'checkbox', 'data-emp':e.id, 'data-app':a.key, checked:e.apps[a.key], disabled:e.role==='admin'?'disabled':null,
        onchange:async ev=>{ e.apps[a.key]=ev.target.checked; try{ await state.api.setStaffApps(e.id, e.apps); flash('Saved'); }catch(er){ ev.target.checked=!ev.target.checked; e.apps[a.key]=ev.target.checked; flash('Not saved: '+er.message); } } }),h('span')))),
      h('td',{ class:'c' },roles[e.role]||e.role)))))));
}

/* ============================================================= sign-in + boot */
async function loadProfileAndRender(auto){
  const me = await state.api.whoami();
  if(!me){
    if(auto){ const last=lsGet('rw_shop'); if(last){ try{ const list=await state.api.shops(); const sh=list.find(x=>x.id===last);
      if(sh && sh.access==='open'){ await enterShop(sh, true); return; } }catch(e){} }
      // a remembered free shop that is still unnamed is not in the public list: go back into it directly
      if(last){ const r=await state.api.enterShop(last); if(r && r.ok){ const m2=await state.api.whoami(); if(m2){ state.me=m2; state.access={}; show('shell'); routeHash(); return; } } } }
    state.me = { guest:true }; state.access = {}; show('shell'); routeHash(); return; }
  if(me.off){ await state.api.signOut(); show('login'); $('#loginErr').textContent='This login is switched off. Ask your manager.'; $('#loginErr').classList.remove('hidden'); return; }
  state.me = me;
  if(me.is_shop) lsSet('rw_shop', me.shopId);
  state.access = me.is_shop ? {} : await state.api.appModes();
  show('shell'); routeHash();
}
function routeHash(){
  const k = (location.hash||'').replace('#','');
  if(k==='admin' && state.me.is_admin){ renderAdmin(); return; }
  const app = APPS.find(a=>a.key===k);
  if(app && allowed(app.key)){ openApp(app); return; }
  renderHome();
}
$('#loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=$('#loginBtn'), code=$('#code').value.trim(), pin=$('#pin').value;
  $('#loginErr').classList.add('hidden');
  if(!code||!pin) return;
  btn.disabled=true; btn.innerHTML='<span class="spin" style="width:18px;height:18px;border-width:2px"></span> Signing in…';
  const res = await state.api.signInPerson(code, pin);
  btn.disabled=false; btn.textContent='Sign in';
  if(res.error){ $('#loginErr').textContent = res.error==='wrong' ? 'That login or PIN isn’t right. Check with your manager.' : res.error; $('#loginErr').classList.remove('hidden'); return; }
  // the old Rota still has its own sign-in: hand it the same code + PIN (this tab only) so it signs in by itself
  if(!code.includes('@')){ try{ sessionStorage.setItem('rw_sso', JSON.stringify({ code:code.toLowerCase().replace(/[^a-z0-9]/g,''), pin:String(pin), t:Date.now() })); }catch(er){} }
  lsSet('rw_shop', null);
  await loadProfileAndRender();
});
$('#logoutBtn').onclick = async ()=>{ if(state.me && state.me.guest){ await showShops(false); return; } try{ sessionStorage.removeItem('rw_sso'); }catch(e){} lsSet('rw_shop', null); await state.api.signOut(); state.me=null; location.hash=''; $('#pin').value=''; await showShops(false); };
$('#themeBtn').onclick = flipTheme;
$('#adminBtn').onclick = ()=> openAdmin();
window.addEventListener('hashchange', ()=>{ if(!$('#shell').classList.contains('hidden') && state.me) routeHash(); });

(async function init(){
  theme();
  try{ state.api = window.RW_API || await makeFirebaseApi(); await loadProfileAndRender(true); }
  catch(e){ show('shops'); shopErr('Couldn’t reach the server. Check your connection and reload.'); }
})();
</script>
