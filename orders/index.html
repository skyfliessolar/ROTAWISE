<style>
:root{--navy:#14273D;--ink:#14273D;--muted:#5b6b7f;--line:#e4e9f0;--bg:#eef1f6;--card:#fff;--accent:#2b5ce6;--good:#1f9d61;--bad:#d8453c;--warn:#a8610c;--warnbg:#fff4e0;--soft:#f3f6fb;--r:14px;--sh:0 1px 2px rgba(20,39,61,.06),0 6px 18px rgba(20,39,61,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--navy:#0f1d2e;--ink:#eaf1fb;--muted:#9db0c6;--line:#24344a;--bg:#0b141f;--card:#132233;--soft:#1a2c41;--warnbg:#3a2a10;--warn:#f0b35a}}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial}
button,input,select,textarea{font:inherit}button{cursor:pointer}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}.fl input,.fl select{font-weight:400;color:var(--ink)}
.phw{position:relative;flex:0 0 auto;cursor:pointer}.ptag{position:absolute;left:2px;bottom:2px;right:2px;background:#ffeb3b;color:#000;font:800 11px/1.2 system-ui,sans-serif;padding:2px 4px;border-radius:4px;display:flex;flex-wrap:wrap;gap:2px;align-items:baseline;pointer-events:none}.ptag.red{background:#d32f2f;color:#fff}.ptag s{opacity:.8;font-weight:600}.ptag i{font-style:normal;flex-basis:100%}
.exp-photo{position:relative}.exp-photo .ptag{left:8px;bottom:8px;right:auto;font-size:15px}.pcts{display:flex;gap:6px;margin-top:8px}.pcts .on{background:var(--accent);color:#fff}.ofprev{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.shopbtn{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:6px 12px;font:600 13px inherit;color:inherit;cursor:pointer;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shopchooser{display:flex;flex-direction:column;gap:8px}.shoprow{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}.shoprow small{color:var(--muted)}
.nsopt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin-top:6px}.nsopt.on{border-color:var(--accent)}.nsopt input{width:18px;height:18px;flex:0 0 18px;margin-top:2px;accent-color:var(--accent)}.nsopt span{display:flex;flex-direction:column;gap:2px;flex:1}.nsopt small{color:var(--muted);font-size:12.5px}.err{color:#b11;font-size:13px;margin-top:6px}.err.hidden{display:none}
.row.exp{flex-wrap:wrap}.row.exp .nm{flex:1 1 160px;min-width:0}@media(max-width:560px){.row.exp .expbtns{flex-basis:100%;justify-content:flex-end}}.row.exp.remove{border-left:4px solid #d33}.row.exp.reduce{border-left:4px solid #e08a00}.row.exp.done{opacity:.6}
.expbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.tag.bad{background:#fde2e2;color:#a11}.tag.warn{background:#fff1d6;color:#8a5300}.tag.soon{background:#fff7c2;color:#6b5600}.tag.info{background:#e0ecff;color:#1d4ed8}.tag.muted{background:var(--line);color:var(--muted)}
.card h2 .cnt{background:var(--accent);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;vertical-align:middle}.cnt.bad{background:#d33}.card.urgent{border-color:#f3b0b0}.bad-t{color:#b11}.warn-t{color:#a36200}.exp-photo{height:170px;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);margin-bottom:8px}.exp-photo img{max-height:100%;max-width:100%}
.chkrow{display:flex;gap:6px;align-items:center;font-size:13px;margin:8px 0}.card summary{cursor:pointer;font-weight:600}
.pic.none{display:grid;place-items:center;font-size:10px;color:var(--muted);cursor:default;text-align:center;line-height:1.1}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px}

.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:20px;font-weight:700;line-height:1}
.qty button.plus{background:var(--accent);border-color:var(--accent);color:#fff}
.qty .n{min-width:28px;text-align:center;font-weight:800;font-size:17px}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;padding:11px 16px}
.btn.alt{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.good{background:var(--good)}
.btn.sm{padding:7px 11px;font-size:13.5px}
.btn:disabled{opacity:.5}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.low{background:#fdeceb;color:#9a2a23}.tag.new{background:#e7f0ff;color:#1f47b8}.tag.ok{background:#e6f6ee;color:#17754a}.tag.seen{background:var(--soft);color:var(--muted)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
.num{width:84px!important;text-align:center;padding:9px 6px!important}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.basket{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,39,61,.08)}
.basket .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.basket b{font-size:16px}
.basket .btn{margin-left:auto}
.flash{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.flash.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,32,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:16px;width:100%;max-width:520px;padding:18px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 10px}
.big{max-width:min(92vw,520px);max-height:80vh;border-radius:12px;display:block;margin:0 auto;image-rendering:auto}
label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.sub{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.sub .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub .hd b{font-size:15px}
.sub ul{margin:8px 0 0;padding-left:18px}
.sub li{margin:2px 0}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,.tabs,main,.flash,.modal,.basket{display:none!important}
  #printArea{display:block;padding:10mm;font:11.5pt/1.35 Arial}
  #printArea h1{font-size:17pt;margin:0 0 2mm}
  #printArea table{width:100%;border-collapse:collapse;margin-top:4mm}
  #printArea th,#printArea td{border-bottom:1px solid #999;padding:2mm 1.5mm;font-size:11pt;color:#000}
  #printArea img{width:22mm;height:15mm;object-fit:cover}
  #printArea .cat{color:#000;margin-top:5mm;font-size:10pt}

<body>
<script>if(window.parent!==window){try{if(window.parent.location.origin===location.origin)document.documentElement.classList.add('embed')}catch(e){}}</script>
<div class="top"><h1>Goods Orders</h1><button class="shopbtn hidden" id="shopBtn" type="button" aria-label="Change shop"></button><select id="storeSel" aria-label="Store"></select></div>
<div class="tabs" id="tabs"></div>
<main id="main"><div class="empty">Loading…</div></main>
<div class="basket hidden" id="basketBar"><div class="in"><div><b id="basketCount"></b><div class="note" style="margin:0">Check it, then send it to your manager.</div></div><button class="btn" id="basketGo">Review &amp; submit</button></div></div>
<div id="printArea"></div>
<div class="flash" id="flash"></div>
<script>
const CATS=['Electronics','Grocery','Ambient','Chocolate & sweets','Soft drinks','Alcohol','Tobacco','Household','Other'];
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='value')el.value=v;else if(k==='checked')el.checked=!!v;else el.setAttribute(k,v===true?'':v)}for(const c of kids.flat(3)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
function flash(m){const f=$('#flash');f.textContent=m;f.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>f.classList.remove('show'),2200)}
const fmt=n=>{n=Number(n||0);return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')};
const money=n=>n==null||n===''||isNaN(n)?'':'£'+Number(n).toFixed(2);
const label=it=>it.name+(it.size?' '+it.size:'');
const when=iso=>{const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};

/* ---------------- data layer: Firebase (tests replace window.GO_API) ----------------
   Data lives in hub_shops/<space>/go_*: a shop's own space, or 'main' for the business. */
async function makeApi(){
  const rw=await import('/fb/rw.js');
  const w=await rw.whoami(); if(!w||w.kind==='off')return {me:async()=>null,rw,who:null};
  // the admin, or a manager the admin assigned, opening a free shop from Rotawise: …/orders/?space=<shop>
  const want=new URLSearchParams(location.search).get('space');let visit=null;
  if(want&&want!==w.space&&/^[a-z0-9]{6,30}$/.test(want)&&(w.kind==='admin'||w.kind==='staff')){visit=await rw.getShop(want);if(!visit)throw new Error('That shop does not exist any more')}
  const sp=await rw.space(visit?visit.id:w.space), now=()=>new Date().toISOString();
  const saved=()=>{try{if(parent!==window)parent.postMessage({rw:'saved'},location.origin)}catch(e){}};
  const byNew=(a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''));
  const mine=async(c,store)=>(await sp.where(c,'store_id',store));
  const strip=o=>{const r={};for(const k in o)if(o[k]!==undefined)r[k]=o[k];return r};
  return {
    rw,who:w,visit,
    async me(){
      if(visit)return {id:w.uid,name:w.name,employee_code:w.code||'admin',is_admin:w.admin,is_manager:true,store_id:'main',visiting:true,shopName:visit.name};
      if(w.kind==='shop')return {id:w.uid,name:'',employee_code:'shop',shared:true,is_manager:true,store_id:'main',shopName:w.name};
      if(w.kind==='admin')return {id:w.uid,name:'Admin',employee_code:'admin',is_admin:true,is_manager:true,allStores:true};
      return {id:w.uid,name:w.name,employee_code:w.code,is_manager:w.manager,is_admin:w.admin,store_id:w.stores[0]||null,extraStores:w.stores,allStores:!w.stores.length};
    },
    async stores(){return visit?[{id:'main',name:visit.name}]:w.kind==='shop'?[{id:'main',name:w.name}]:await rw.businessStores()},
    async catalog(){const r=await fetch('catalog/gadjet.json',{cache:'no-cache'});return r.ok?(await r.json()).filter(x=>x.active!==false):[]},
    async items(store){return (await mine('go_items',store)).filter(x=>x.active!==false).sort((a,b)=>String(a.category).localeCompare(String(b.category))||String(a.name).localeCompare(String(b.name)))},
    async openRequests(store){return (await mine('go_requests',store)).filter(x=>x.status==='open').sort((a,b)=>-byNew(a,b))},
    async submissions(store){return (await mine('go_submissions',store)).filter(x=>x.status==='new'||x.status==='seen').sort(byNew)},
    async addItem(row){const o=strip({...row,active:true,current_stock:row.current_stock??null,created_at:now()});const r=await sp.add('go_items',o);saved();return r},
    async updateItem(id,patch){await sp.patch('go_items',id,strip(patch))},
    async submit(sub,lines){
      const bt=sp.batch(),sref=sp.newRef('go_submissions'),t=now();
      bt.set(sref,strip({...sub,created_at:t}));
      lines.forEach(l=>bt.set(sp.newRef('go_requests'),strip({store_id:sub.store_id,item_id:l.item_id,qty:l.qty,status:'open',requested_by:sub.submitted_by,requested_by_name:sub.submitted_by_name,submission_id:sref.id,created_at:t})));
      await bt.commit();saved();return {id:sref.id,...sub,created_at:t}},
    async markSeen(id){await sp.patch('go_submissions',id,{status:'seen'})},
    async setStock(item,qty){await sp.patch('go_items',item,{current_stock:qty,stock_updated_at:now()});saved()},
    async createOrder(row,reqIds,subIds){
      const bt=sp.batch(),oref=sp.newRef('go_orders'),o=strip({...row,created_at:now()});
      bt.set(oref,o);reqIds.forEach(id=>bt.update(sp.ref('go_requests',id),{status:'ordered',order_id:oref.id}));
      subIds.forEach(id=>bt.update(sp.ref('go_submissions',id),{status:'ordered'}));
      await bt.commit();return {id:oref.id,...o}},
    async orders(store){return (await mine('go_orders',store)).sort(byNew).slice(0,30)},
    async getEmails(){const d=await sp.get('go_settings','email');return (d&&d.value)||{}},
    async setEmails(v){await sp.set('go_settings','email',{value:v})},
    async expiry(store){return (await mine('go_expiry',store))},
    async addExpiry(row){const r=await sp.add('go_expiry',strip(row));saved();return r},
    async updateExpiry(id,patch){await sp.patch('go_expiry',id,strip(patch))},
    async delExpiry(id){await sp.del('go_expiry',id)},
    async getExpCfg(){const d=await sp.get('go_settings','expiry');return (d&&d.value)||{}},
    async setExpCfg(v){await sp.set('go_settings','expiry',{value:v})}
  };
}

/* ---------------- state ---------------- */
const S={api:null,me:null,stores:[],store:null,tab:'need',items:[],catalog:[],reqs:[],subs:[],orders:[],emails:{},cat:'All',q:'',draft:null,basket:{},exp:[],expCfg:{}};
const isMgr=()=>!!(S.me&&(S.me.is_admin||(S.me.is_manager&&!S.me.is_shop)));
const storeName=()=>{const i=S.stores.findIndex(s=>s.id===S.store);return i<0?'your shop':(S.stores[i].name||'Store '+(i+1))};
const isLow=it=>it.min_qty!=null&&it.current_stock!=null&&Number(it.current_stock)<=Number(it.min_qty);

/* One list of everything a person can ask for: this shop's items plus supplier catalogue lines the shop hasn't stocked yet. */
function products(){
  const have=new Set(S.items.filter(i=>i.code).map(i=>i.code));
  const out=S.items.map(i=>({key:'i:'+i.id,item:i,code:i.code,name:i.name,size:i.size,category:i.category,price:i.price,photo:i.photo,note:i.note,supplier:i.supplier}));
  for(const c of S.catalog)if(!have.has(c.code))out.push({key:'c:'+c.code,cat:c,code:c.code,name:c.name,size:c.size,category:c.category,price:c.price,photo:c.photo,note:c.note,supplier:c.supplier});
  return out.sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category)||a.category.localeCompare(b.category)||String(a.code||'~').localeCompare(String(b.code||'~'))||a.name.localeCompare(b.name));
}
const askedFor=p=>p.item?S.reqs.filter(r=>r.item_id===p.item.id).reduce((t,r)=>t+Number(r.qty),0):0;

/* basket: kept on this device per shop until submitted */
const bKey=()=>'go_basket_'+S.store;
function loadBasket(){try{S.basket=JSON.parse(localStorage.getItem(bKey())||'{}')}catch(e){S.basket={}}}
function saveBasket(){try{localStorage.setItem(bKey(),JSON.stringify(S.basket))}catch(e){}renderBasketBar()}
function basketCount(){return Object.values(S.basket).reduce((t,n)=>t+Number(n||0),0)}
function renderBasketBar(){const n=basketCount(),lines=Object.values(S.basket).filter(x=>x>0).length;
  $('#basketBar').classList.toggle('hidden',!n||S.tab!=='need');$('#basketCount').textContent='Your list: '+lines+(lines===1?' item':' items')+' ('+n+' in total)'}

/* What the manager should order: everything staff submitted, plus anything on auto-order that has run low. */
function buildOrderLines(){
  const lines=[];
  for(const it of S.items){
    const reqs=S.reqs.filter(r=>r.item_id===it.id), asked=reqs.reduce((t,r)=>t+Number(r.qty),0);
    let auto=0;
    if(it.auto_order&&isLow(it))auto=it.order_qty!=null&&Number(it.order_qty)>0?Number(it.order_qty):Math.max(1,Number(it.min_qty)-Number(it.current_stock)+1);
    const qty=Math.max(asked,auto);
    if(qty>0)lines.push({item_id:it.id,category:it.category,code:it.code||'',name:it.name,size:it.size||'',price:it.price,photo:it.photo,qty,asked,auto,stock:it.current_stock,min:it.min_qty,
      who:[...new Set(reqs.map(r=>r.requested_by_name).filter(Boolean))]});
  }
  return lines;
}

async function load(){
  const jobs=[S.api.items(S.store),S.api.openRequests(S.store),S.api.catalog().catch(()=>[]),S.api.expiry?S.api.expiry(S.store).catch(()=>[]):[],S.api.getExpCfg?S.api.getExpCfg().catch(()=>({})):{}];
  if(isMgr())jobs.push(S.api.submissions(S.store));

/* ---- one file with every expiry entry: photo, price/offer, dates, who added it (for keeping) ---- */
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}

function drawCard(x,c,y,W){
  const {e,img}=c,P=150;x.fillStyle='#fff';x.fillRect(40,y,W-80,P+30);x.strokeStyle='#d9dde3';x.lineWidth=2;x.strokeRect(40,y,W-80,P+30);
  x.fillStyle='#eef0f3';x.fillRect(55,y+15,P,P);
  if(img){const k=Math.max(P/img.width,P/img.height),w=img.width*k,hh=img.height*k;x.save();x.beginPath();x.rect(55,y+15,P,P);x.clip();x.drawImage(img,55+(P-w)/2,y+15+(P-hh)/2,w,hh);x.restore()}
  else{x.fillStyle='#9aa1ab';x.font='600 20px system-ui,sans-serif';x.fillText('No photo',80,y+95)}
  const tag=e.reduced_at&&(e.reduced_price!=null||offerText(e))?(e.reduced_price!=null?money(e.reduced_price):'')+(offerText(e)?' '+offerText(e):''):money(e.price);
  if(tag){x.font='800 20px system-ui,sans-serif';const tw=x.measureText(tag).width+14;x.fillStyle=e.reduced_at?'#d32f2f':'#ffeb3b';x.fillRect(58,y+P-17,Math.min(tw,P-6),28);x.fillStyle=e.reduced_at?'#fff':'#000';x.fillText(tag,65,y+P+4,P-20)}
  const s=expState(e),st={remove:'TAKE OFF THE SHELF',reduce:'REDUCE NOW',reduced:'REDUCED',month:'THIS MONTH',later:'',done:'OFF THE SHELF'}[s];
  const tx=230;x.fillStyle='#111';x.font='700 30px system-ui,sans-serif';x.fillText(e.name+(e.qty>1?' × '+e.qty:''),tx,y+50,W-tx-60);
  x.font='22px system-ui,sans-serif';x.fillStyle='#333';
  const L=[(e.month_only?'Best before end ':'Expires ')+dmy(e.expiry)+(e.price!=null?'   ·   Price '+money(e.price):''),
    e.reduced_at?'Reduced '+dmyt(e.reduced_at)+(e.reduced_price!=null?' to '+money(e.reduced_price):'')+(offerText(e)?' · '+offerText(e):''):(e.reduce_at?'Reduce on '+dmyt(e.reduce_at):''),
    (e.removed_at?'Taken off the shelf '+dmyt(e.removed_at):'Still on the shelf')+(e.created_by_name?'   ·   Added by '+e.created_by_name:'')];
  L.filter(Boolean).forEach((t,i)=>x.fillText(t,tx,y+88+i*32,W-tx-60));
  if(st){x.font='700 18px system-ui,sans-serif';const w=x.measureText(st).width+20;x.fillStyle={remove:'#fde2e2',reduce:'#fff1d6',reduced:'#e0ecff',month:'#fff7c2',done:'#e8eaed'}[s];x.fillRect(W-60-w,y+18,w,30);x.fillStyle={remove:'#a11',reduce:'#8a5300',reduced:'#1d4ed8',month:'#6b5600',done:'#555'}[s];x.fillText(st,W-50-w,y+40)}
}
function reportHead(x,W,page,pages){
  x.fillStyle='#111';x.font='800 40px system-ui,sans-serif';x.fillText('Expiry dates · '+storeName(),40,70,W-80);
  x.font='22px system-ui,sans-serif';x.fillStyle='#555';x.fillText('Saved '+dmyt(nowStr())+(pages>1?'   ·   page '+page+' of '+pages:''),40,108);

function pageCanvases(rows,perPage,W,H){
  const pages=Math.max(1,Math.ceil(rows.length/perPage)),out=[];
  for(let p=0;p<pages;p++){const part=rows.slice(p*perPage,(p+1)*perPage),hh=H||(150+part.length*200+40);
    const c=document.createElement('canvas');c.width=W;c.height=hh;const x=c.getContext('2d');x.fillStyle='#f5f6f8';x.fillRect(0,0,W,hh);
    reportHead(x,W,p+1,pages);part.forEach((r,i)=>drawCard(x,r,150+i*200,W));out.push(c)}
  return out;
}
const toJpeg=c=>new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
/* a small PDF writer: one JPEG per A4 page */
async function jpegsToPdf(canvases){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const n=canvases.length,kids=[];for(let i=0;i<n;i++)kids.push((3+i*3)+' 0 R');
  push('%PDF-1.4\n');
  const obj=(id,body)=>{offs[id]=len;push(id+' 0 obj\n');if(typeof body==='string')push(body);else body();push('\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  for(let i=0;i<n;i++){const c=canvases[i],jpg=new Uint8Array(await (await toJpeg(c)).arrayBuffer()),pw=595.28,ph=pw*c.height/c.width,pid=3+i*3;
    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw.toFixed(2)+' '+ph.toFixed(2)+'] /Resources << /XObject << /Im'+i+' '+(pid+2)+' 0 R >> >> /Contents '+(pid+1)+' 0 R >>');
    const cs='q '+pw.toFixed(2)+' 0 0 '+ph.toFixed(2)+' 0 0 cm /Im'+i+' Do Q';obj(pid+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    obj(pid+2,()=>{push('<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream')})}
  const total=3+n*3,x=len;let xr='xref\n0 '+total+'\n0000000000 65535 f \n';for(let i=1;i<total;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(xr+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function saveBlob(b,name){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function downloadReport(kind){
  flash('Making the file…');const rows=await reportRows();if(!rows.length)return flash('Nothing to save yet');

  try{
    if(kind==='pdf'){saveBlob(await jpegsToPdf(pageCanvases(rows,8,1240,1754)),base+'.pdf')}
    else{const cs=pageCanvases(rows,60,1240);for(let i=0;i<cs.length;i++)saveBlob(await toJpeg(cs[i]),base+(cs.length>1?' part '+(i+1):'')+'.jpg')}
