<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goods Orders</title>
<meta name="theme-color" content="#14273D">
<style>
:root{--navy:#14273D;--ink:#14273D;--muted:#5b6b7f;--line:#e4e9f0;--bg:#eef1f6;--card:#fff;--accent:#2b5ce6;--good:#1f9d61;--bad:#d8453c;--warn:#a8610c;--warnbg:#fff4e0;--soft:#f3f6fb;--r:14px;--sh:0 1px 2px rgba(20,39,61,.06),0 6px 18px rgba(20,39,61,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--navy:#0f1d2e;--ink:#eaf1fb;--muted:#9db0c6;--line:#24344a;--bg:#0b141f;--card:#132233;--soft:#1a2c41;--warnbg:#3a2a10;--warn:#f0b35a}}
:root[data-theme=dark]{--navy:#0f1d2e;--ink:#eaf1fb;--muted:#9db0c6;--line:#24344a;--bg:#0b141f;--card:#132233;--soft:#1a2c41;--warnbg:#3a2a10;--warn:#f0b35a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.embed .top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
.embed .top h1{display:none}
.top select{margin-left:auto;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:60vw}
.tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;max-width:980px;margin:0 auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 15px;font-weight:650;font-size:14.5px;white-space:nowrap}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;margin-left:6px}
main{max-width:980px;margin:0 auto;padding:14px 16px 110px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 4px}
.note{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text],input[type=number],input[type=email],input[type=search],select.f,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block}
.row .nm small{color:var(--muted);display:block}
.pic{width:64px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft);border:1px solid var(--line);flex:none;cursor:zoom-in}
.photobtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}.fl input,.fl select{font-weight:400;color:var(--ink)}
.pic.none{display:grid;place-items:center;font-size:10px;color:var(--muted);cursor:default;text-align:center;line-height:1.1}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px}
.chk{display:block;margin-top:4px;font-size:12.5px;color:var(--warn);background:var(--warnbg);border-radius:7px;padding:3px 7px}
.cat{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:20px;font-weight:700;line-height:1}
.qty button.plus{background:var(--accent);border-color:var(--accent);color:#fff}
.qty .n{min-width:28px;text-align:center;font-weight:800;font-size:17px}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;padding:11px 16px}
.btn.alt{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.good{background:var(--good)}
.btn.sm{padding:7px 11px;font-size:13.5px}
.btn:disabled{opacity:.5}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.low{background:#fdeceb;color:#9a2a23}.tag.new{background:#e7f0ff;color:#1f47b8}.tag.ok{background:#e6f6ee;color:#17754a}.tag.seen{background:var(--soft);color:var(--muted)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
.num{width:84px!important;text-align:center;padding:9px 6px!important}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.basket{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,39,61,.08)}
.basket .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.basket b{font-size:16px}
.basket .btn{margin-left:auto}
.flash{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.flash.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,20,32,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:16px;width:100%;max-width:520px;padding:18px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 10px}
.big{max-width:min(92vw,520px);max-height:80vh;border-radius:12px;display:block;margin:0 auto;image-rendering:auto}
label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.sub{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.sub .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub .hd b{font-size:15px}
.sub ul{margin:8px 0 0;padding-left:18px}
.sub li{margin:2px 0}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,.tabs,main,.flash,.modal,.basket{display:none!important}
  #printArea{display:block;padding:10mm;font:11.5pt/1.35 Arial}
  #printArea h1{font-size:17pt;margin:0 0 2mm}
  #printArea table{width:100%;border-collapse:collapse;margin-top:4mm}
  #printArea th,#printArea td{border-bottom:1px solid #999;padding:2mm 1.5mm;font-size:11pt;color:#000}
  #printArea img{width:22mm;height:15mm;object-fit:cover}
  #printArea .cat{color:#000;margin-top:5mm;font-size:10pt}
}
</style>
</head>
<body>
<script>if(window.parent!==window){try{if(window.parent.location.origin===location.origin)document.documentElement.classList.add('embed')}catch(e){}}</script>
<div class="top"><h1>Goods Orders</h1><select id="storeSel" aria-label="Store"></select></div>
<div class="tabs" id="tabs"></div>
<main id="main"><div class="empty">Loading…</div></main>
<div class="basket hidden" id="basketBar"><div class="in"><div><b id="basketCount"></b><div class="note" style="margin:0">Check it, then send it to your manager.</div></div><button class="btn" id="basketGo">Review &amp; submit</button></div></div>
<div id="printArea"></div>
<div class="flash" id="flash"></div>
<script>
const CATS=['Electronics','Grocery','Ambient','Chocolate & sweets','Soft drinks','Alcohol','Tobacco','Household','Other'];
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='value')el.value=v;else if(k==='checked')el.checked=!!v;else el.setAttribute(k,v===true?'':v)}for(const c of kids.flat(3)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
function flash(m){const f=$('#flash');f.textContent=m;f.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>f.classList.remove('show'),2200)}
const fmt=n=>{n=Number(n||0);return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')};
const money=n=>n==null||n===''?'':'£'+Number(n).toFixed(2);
const label=it=>it.name+(it.size?' '+it.size:'');
const when=iso=>{const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};

/* ---------------- data layer: Firebase (tests replace window.GO_API) ----------------
   Data lives in hub_shops/<space>/go_*: a shop's own space, or 'main' for the business. */
async function makeApi(){
  const rw=await import('/fb/rw.js');
  const w=await rw.whoami(); if(!w||w.kind==='off')return {me:async()=>null};
  const sp=await rw.space(w.space), now=()=>new Date().toISOString();
  const byNew=(a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''));
  const mine=async(c,store)=>(await sp.where(c,'store_id',store));
  const strip=o=>{const r={};for(const k in o)if(o[k]!==undefined)r[k]=o[k];return r};
  return {
    async me(){
      if(w.kind==='shop')return {id:w.uid,name:'',employee_code:'shop',shared:true,is_manager:true,store_id:'main',shopName:w.name};
      if(w.kind==='admin')return {id:w.uid,name:'Admin',employee_code:'admin',is_admin:true,is_manager:true,allStores:true};
      return {id:w.uid,name:w.name,employee_code:w.code,is_manager:w.manager,is_admin:w.admin,store_id:w.stores[0]||null,extraStores:w.stores,allStores:!w.stores.length};
    },
    async stores(){return w.kind==='shop'?[{id:'main',name:w.name}]:await rw.businessStores()},
    async catalog(){const r=await fetch('catalog/gadjet.json',{cache:'no-cache'});return r.ok?(await r.json()).filter(x=>x.active!==false):[]},
    async items(store){return (await mine('go_items',store)).filter(x=>x.active!==false).sort((a,b)=>String(a.category).localeCompare(String(b.category))||String(a.name).localeCompare(String(b.name)))},
    async openRequests(store){return (await mine('go_requests',store)).filter(x=>x.status==='open').sort((a,b)=>-byNew(a,b))},
    async submissions(store){return (await mine('go_submissions',store)).filter(x=>x.status==='new'||x.status==='seen').sort(byNew)},
    async addItem(row){const o=strip({...row,active:true,current_stock:row.current_stock??null,created_at:now()});return await sp.add('go_items',o)},
    async updateItem(id,patch){await sp.patch('go_items',id,strip(patch))},
    async submit(sub,lines){
      const bt=sp.batch(),sref=sp.newRef('go_submissions'),t=now();
      bt.set(sref,strip({...sub,created_at:t}));
      lines.forEach(l=>bt.set(sp.newRef('go_requests'),strip({store_id:sub.store_id,item_id:l.item_id,qty:l.qty,status:'open',requested_by:sub.submitted_by,requested_by_name:sub.submitted_by_name,submission_id:sref.id,created_at:t})));
      await bt.commit();return {id:sref.id,...sub,created_at:t}},
    async markSeen(id){await sp.patch('go_submissions',id,{status:'seen'})},
    async setStock(item,qty){await sp.patch('go_items',item,{current_stock:qty,stock_updated_at:now()})},
    async createOrder(row,reqIds,subIds){
      const bt=sp.batch(),oref=sp.newRef('go_orders'),o=strip({...row,created_at:now()});
      bt.set(oref,o);reqIds.forEach(id=>bt.update(sp.ref('go_requests',id),{status:'ordered',order_id:oref.id}));
      subIds.forEach(id=>bt.update(sp.ref('go_submissions',id),{status:'ordered'}));
      await bt.commit();return {id:oref.id,...o}},
    async orders(store){return (await mine('go_orders',store)).sort(byNew).slice(0,30)},
    async getEmails(){const d=await sp.get('go_settings','email');return (d&&d.value)||{}},
    async setEmails(v){await sp.set('go_settings','email',{value:v})}
  };
}

/* ---------------- state ---------------- */
const S={api:null,me:null,stores:[],store:null,tab:'need',items:[],catalog:[],reqs:[],subs:[],orders:[],emails:{},cat:'All',q:'',draft:null,basket:{}};
const isMgr=()=>!!(S.me&&(S.me.is_admin||(S.me.is_manager&&!S.me.is_shop)));
const storeName=()=>{const i=S.stores.findIndex(s=>s.id===S.store);return i<0?'your shop':(S.stores[i].name||'Store '+(i+1))};
const isLow=it=>it.min_qty!=null&&it.current_stock!=null&&Number(it.current_stock)<=Number(it.min_qty);

/* One list of everything a person can ask for: this shop's items plus supplier catalogue lines the shop hasn't stocked yet. */
function products(){
  const have=new Set(S.items.filter(i=>i.code).map(i=>i.code));
  const out=S.items.map(i=>({key:'i:'+i.id,item:i,code:i.code,name:i.name,size:i.size,category:i.category,price:i.price,photo:i.photo,note:i.note,supplier:i.supplier}));
  for(const c of S.catalog)if(!have.has(c.code))out.push({key:'c:'+c.code,cat:c,code:c.code,name:c.name,size:c.size,category:c.category,price:c.price,photo:c.photo,note:c.note,supplier:c.supplier});
  return out.sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category)||a.category.localeCompare(b.category)||String(a.code||'~').localeCompare(String(b.code||'~'))||a.name.localeCompare(b.name));
}
const askedFor=p=>p.item?S.reqs.filter(r=>r.item_id===p.item.id).reduce((t,r)=>t+Number(r.qty),0):0;

/* basket: kept on this device per shop until submitted */
const bKey=()=>'go_basket_'+S.store;
function loadBasket(){try{S.basket=JSON.parse(localStorage.getItem(bKey())||'{}')}catch(e){S.basket={}}}
function saveBasket(){try{localStorage.setItem(bKey(),JSON.stringify(S.basket))}catch(e){}renderBasketBar()}
function basketCount(){return Object.values(S.basket).reduce((t,n)=>t+Number(n||0),0)}
function renderBasketBar(){const n=basketCount(),lines=Object.values(S.basket).filter(x=>x>0).length;
  $('#basketBar').classList.toggle('hidden',!n||S.tab!=='need');$('#basketCount').textContent='Your list: '+lines+(lines===1?' item':' items')+' ('+n+' in total)'}

/* What the manager should order: everything staff submitted, plus anything on auto-order that has run low. */
function buildOrderLines(){
  const lines=[];
  for(const it of S.items){
    const reqs=S.reqs.filter(r=>r.item_id===it.id), asked=reqs.reduce((t,r)=>t+Number(r.qty),0);
    let auto=0;
    if(it.auto_order&&isLow(it))auto=it.order_qty!=null&&Number(it.order_qty)>0?Number(it.order_qty):Math.max(1,Number(it.min_qty)-Number(it.current_stock)+1);
    const qty=Math.max(asked,auto);
    if(qty>0)lines.push({item_id:it.id,category:it.category,code:it.code||'',name:it.name,size:it.size||'',price:it.price,photo:it.photo,qty,asked,auto,stock:it.current_stock,min:it.min_qty,
      who:[...new Set(reqs.map(r=>r.requested_by_name).filter(Boolean))]});
  }
  return lines;
}

async function load(){
  const jobs=[S.api.items(S.store),S.api.openRequests(S.store),S.api.catalog().catch(()=>[])];
  if(isMgr())jobs.push(S.api.submissions(S.store));
  const r=await Promise.all(jobs);[S.items,S.reqs,S.catalog]=r;S.subs=r[3]||[];
  S.draft=null;loadBasket();
}
async function reload(){try{await load()}catch(e){flash('Could not load: '+e.message)}render()}

/* ---------------- render ---------------- */
function render(){
  const tabs=[['need','What we need'],['stock','Stock count']];
  const newSubs=S.subs.filter(s=>s.status==='new').length;
  if(isMgr())tabs.unshift(['subs','Submitted']),tabs.push(['order','Order'],['items','Items & levels'],['history','Past orders']);
  if(!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
  const n=buildOrderLines().length;
  $('#tabs').replaceChildren(...tabs.map(([k,t])=>h('button',{class:S.tab===k?'on':'','data-tab':k,onclick:()=>{S.tab=k;if(k==='history')loadHistory();else render()}},t,
    k==='order'&&n?h('span',{class:'cnt'},n):null,k==='subs'&&newSubs?h('span',{class:'cnt'},newSubs):null)));
  $('#main').replaceChildren(({subs:viewSubs,need:viewNeed,stock:viewStock,order:viewOrder,items:viewItems,history:viewHistory}[S.tab]||viewNeed)());
  renderBasketBar();
}
function catChips(list){
  const used=['All',...CATS.filter(c=>list.some(i=>i.category===c)),...[...new Set(list.map(i=>i.category))].filter(c=>!CATS.includes(c))];
  return h('div',{class:'chips'},used.map(c=>h('button',{class:'chip'+(S.cat===c?' on':''),onclick:()=>{S.cat=c;render()}},c)));
}
function filtered(list){const q=S.q.trim().toLowerCase();return list.filter(i=>(S.cat==='All'||i.category===S.cat)&&(!q||((i.code||'')+' '+label(i)+' '+(i.supplier||'')).toLowerCase().includes(q)))}
function byCat(list,rowFn){const out=[];let cur=null;for(const it of list){if(it.category!==cur){cur=it.category;out.push(h('div',{class:'cat'},cur))}out.push(rowFn(it))}return out}
function searchBox(ph){return h('input',{type:'search',placeholder:ph||'Search by name or code…',value:S.q,style:{marginBottom:'10px'},oninput:e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const i=document.querySelector('input[type=search]');if(i){i.focus();i.setSelectionRange(p,p)}}})}
function pic(p){
  return p.photo?h('img',{class:'pic',src:p.photo,alt:p.name,loading:'lazy',onclick:()=>showPhoto(p)}):h('button',{class:'pic none',type:'button',title:'Add a photo',onclick:()=>showPhoto(p)},'+ photo');
}
/* the shop's own item behind a list line (catalogue lines become items the first time they are changed) */
function itemOf(p){if(p.item)return p.item;if(p.id&&S.items.some(i=>i.id===p.id))return p;return null}
async function ensureItem(p){
  const it=itemOf(p);if(it)return it;const c=p.cat;
  const n=await S.api.addItem({store_id:S.store,code:c.code,supplier:c.supplier||null,category:c.category,name:c.name,size:c.size||null,price:c.price??null,photo:c.photo||null,note:c.note||null,created_by:S.me.id});
  S.items.push(n);return n;
}
/* phone photos are big: shrink to 480px and keep it inside the item (about 40 KB) */
function shrinkPhoto(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That file is not a picture'))};im.src=u})}
async function setPhoto(p,photo,m){
  try{const it=await ensureItem(p);await S.api.updateItem(it.id,{photo});it.photo=photo;p.photo=photo;flash(photo?'Photo saved':'Photo removed');if(m)m.remove();render()}
  catch(e){flash('Not saved: '+e.message)}
}
function photoPicker(p,m,capture){
  const inp=h('input',{type:'file',accept:'image/*',capture:capture?'environment':null,style:{display:'none'},onchange:async e=>{const f=e.target.files[0];if(!f)return;
    try{await setPhoto(p,await shrinkPhoto(f),m)}catch(er){flash(er.message)}}});
  document.body.append(inp);inp.click();setTimeout(()=>inp.remove(),60000);
}
function showPhoto(p){
  const m=h('div',{class:'modal',onclick:e=>{if(e.target===m)m.remove()}},h('div',{class:'sheet',style:{textAlign:'center'}},
    p.photo?h('img',{class:'big',src:p.photo,alt:p.name}):h('div',{class:'pic none',style:{width:'100%',height:'160px',fontSize:'14px'}},'No photo yet'),
    h('p',null,p.code?h('span',{class:'code'},p.code):null,h('b',null,label(p))),
    p.note?h('span',{class:'chk'},'Check: '+p.note):null,
    h('div',{class:'photobtns'},

/* ---------------- boot ---------------- */
(async function(){
  try{const t=localStorage.getItem('rw_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
  try{
    S.api=window.GO_API||await makeApi();
    S.me=await S.api.me();
    if(!S.me){$('#tabs').replaceChildren();$('#main').replaceChildren(h('div',{class:'card'},h('h2',null,'Choose your shop first'),h('p',{class:'note'},'Goods Orders opens from Rotawise.'),h('a',{class:'btn',href:'../hub/',target:'_top',style:{display:'inline-block',textDecoration:'none'}},'Go to Rotawise')));return}
    S.stores=await S.api.stores();
    const me=S.me, mine=new Set([me.store_id,...(me.extraStores||[]),...(me.managed||[])].filter(Boolean));
    let list=me.is_admin||me.allStores||me.shared?S.stores:S.stores.filter(s=>mine.has(s.id));
    if(!list.length){$('#main').replaceChildren(h('div',{class:'empty'},'No shop is linked to this login yet. Ask your admin.'));return}
    let saved=null;try{saved=localStorage.getItem('go_store')}catch(e){}
    S.store=(list.find(s=>s.id===saved)||list.find(s=>s.id===me.store_id)||list[0]).id;
    const sel=$('#storeSel');sel.replaceChildren(...list.map((s,i)=>h('option',{value:s.id,selected:s.id===S.store},s.name||('Store '+(i+1)))));
    sel.classList.toggle('hidden',list.length<2);
    sel.onchange=async()=>{S.store=sel.value;try{localStorage.setItem('go_store',S.store)}catch(e){}await reload()};
    if(isMgr()){S.tab='subs';try{S.emails=await S.api.getEmails()}catch(e){}}
    await reload();
  }catch(e){$('#main').replaceChildren(h('div',{class:'empty'},'Could not load Goods Orders: '+e.message))}
})();
</script>
</body>
</html>
