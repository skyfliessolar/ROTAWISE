<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotawise — Gas Deliveries</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F6F8;--card:#FFFFFF;--ink:#14273D;--mute:#6B7F96;--line:#DFE5EC;--soft:#EDF1F5;
  --nav:#14273D;--navink:#FFFFFF;--btn:#14273D;--btnink:#FFFFFF;
  --propane:#D9472B;--butane:#1F5FA8;--patio:#2E8B57;--camping:#D9A100;--other:#6B7F96;
  --ok:#0E7A57;--warn:#B57A00;--bad:#C0392F;--info:#1F5FA8;--r:12px;
  --display:'Barlow Condensed',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button:disabled,input:disabled,select:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--butane);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
a{color:inherit}

.top{background:var(--nav);color:var(--navink);position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px}
.wide-top .top-in{max-width:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.3px;text-decoration:none;color:inherit}
.brand small{font-family:'Public Sans',system-ui,sans-serif;font-size:13px;font-weight:600;opacity:.75;letter-spacing:0;padding-left:10px;border-left:1px solid rgba(255,255,255,.3);white-space:nowrap}
.brand svg{width:26px;height:26px}
.sp{flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill b{font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:#4ec06a;display:block}
.pill.off i{background:#f0b72c}
.me{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
@media (max-width:480px){.pill b{display:none}.pill{padding:6px}}
.dnav{display:none;gap:2px;margin-left:14px}
.dnav button{background:none;border:0;color:var(--navink);opacity:.75;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.dnav button.on{opacity:1;background:#fff;color:var(--ink)}
.dnav .cnt,.bnav .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:4px}

main{max-width:1040px;margin:0 auto;padding:16px}
main.wide{max-width:none}
h1{font-family:var(--display);font-size:30px;font-weight:700;margin:4px 0 12px;letter-spacing:.2px;line-height:1.1}
h2{font-family:var(--display);font-size:20px;margin:24px 0 8px;font-weight:600;letter-spacing:.2px}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--mute)}
.small{font-size:13px}

.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bnav button{background:none;border:0;color:var(--navink);opacity:.62;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;font-weight:600;padding:6px 8px;border-radius:10px;cursor:pointer;min-width:58px;position:relative}
.bnav button.on{opacity:1;background:rgba(255,255,255,.12)}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav .cnt{position:absolute;top:2px;right:6px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:19;background:var(--ink);color:#fff;border:0;
  border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;display:flex;gap:8px;align-items:center}
.fab svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
@media (min-width:860px){.bnav{display:none}.dnav{display:flex}body{padding-bottom:40px}.fab{bottom:24px}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.kpi b{font-size:25px}.kpi{padding:10px 12px}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--other))}
.kpi b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;letter-spacing:.2px}
.kpi span{font-size:13px;color:var(--mute)}
.kpi em{font-style:normal;font-size:12px;color:var(--mute);display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.storebar{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;margin:-4px 0 12px;padding:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.storebar .lbl{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.storebar .chips{margin:0}
.stag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--soft);color:var(--ink);border:1px solid var(--line);vertical-align:1px}
.tablewrap.auto{min-height:0;max-height:none}
.bystore th,.bystore td.txt,.bystore td.bal{padding:6px 10px!important;height:auto}
.chk{display:flex;flex-wrap:wrap;gap:4px 16px}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.dangerf{background:var(--bad);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.big{padding:14px 18px;font-size:16px}
a.btn,label.btn{text-decoration:none;display:inline-block}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.empty{text-align:center;padding:30px 16px;color:var(--mute)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg2 button{border:0;background:none;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--mute)}
.seg2 button.on{background:var(--btn);color:var(--btnink)}
.banner{border-radius:var(--r);padding:12px 14px;margin:10px 0;border:1px solid}
.banner.warn{background:#FDF3DC;border-color:#F0D9A8}
.banner.bad{background:#FBEAE8;border-color:#F1C4BF}
.banner.info{background:#E6EFF9;border-color:#C5D8EE}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}

.cyl{display:inline-block;width:11px;height:17px;border-radius:4px 4px 3px 3px;background:var(--c,var(--other));position:relative;vertical-align:-3px;margin-right:6px;flex:none}
.cyl:before{content:"";position:absolute;left:3px;right:3px;top:-3px;height:3px;background:var(--c,var(--other));border-radius:2px 2px 0 0}
.cyl:after{content:"";position:absolute;left:2px;right:2px;top:4px;height:2px;background:rgba(255,255,255,.55)}
.g-Propane{--c:var(--propane)}.g-Butane{--c:var(--butane)}.g-Patio{--c:var(--patio)}.g-CampingGas{--c:var(--camping)}.g-Other{--c:var(--other)}

.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px}
.filters{display:grid;gap:8px}
.dates{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center}
.dates .in{min-height:40px;padding:8px 10px}.dates .l{margin:0}
@media (min-width:860px){.filters{grid-template-columns:1fr 400px}}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:block;width:100%;text-align:left}
.ocard + .ocard{margin-top:8px}
.ocard.unpaid{border-left:5px solid var(--bad)}.ocard.todeliver{border-left:5px solid var(--warn)}.ocard.ok{border-left:5px solid var(--ok)}.ocard.del{border-left:5px solid var(--mute);opacity:.8}
.ohead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ohead strong{font-size:16px}
.amt{font-weight:800;font-size:17px}
.meta{font-size:13px;color:var(--mute)}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.it{display:inline-flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 9px 3px 8px;font-size:13px;font-weight:600}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}.t-mute{color:var(--mute)}.t-info{color:var(--info)}
.oact{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.warnline{font-size:12px;color:var(--warn);margin-top:6px}
.flagbox{margin-top:8px;padding:8px 10px;border-radius:8px;background:#FBEAE8;border:1px solid #F1C4BF;font-size:13px}
.flagbox.done{background:var(--soft);border-color:var(--line);color:var(--mute)}
@media (min-width:860px){.olist{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ocard+.ocard{margin-top:0}}

.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:calc(100vh - 270px);min-height:240px}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;white-space:nowrap;background:var(--card)}
.sheet thead th{position:sticky;z-index:3;background:var(--soft);font-weight:700;text-align:left;padding:0 8px;font-size:12px;height:28px}
.sheet thead tr:first-child th{top:0}
.sheet thead tr:nth-child(2) th{top:28px}
.sheet th.grp{border-top:3px solid var(--c,var(--other));text-align:center}
.sheet .st1{position:sticky;left:0;z-index:2;min-width:96px;max-width:96px}
.sheet .st2{position:sticky;left:96px;z-index:2;min-width:180px;box-shadow:2px 0 0 var(--line)}
.sheet thead .st1,.sheet thead .st2{z-index:4}
.sheet tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:700;padding:0 8px;height:32px;z-index:2}
.sheet tfoot .st1,.sheet tfoot .st2{z-index:4}
.cell{border:0;background:transparent;width:100%;height:32px;padding:0 8px;min-width:0;border-radius:0}
select.cell{padding:0 4px;cursor:pointer}
.cell:focus{outline:2px solid var(--butane);outline-offset:-2px;background:var(--card)}
input.cell[type=number]{text-align:right;-moz-appearance:textfield}
input.cell[type=number]::-webkit-outer-spin-button,input.cell[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sheet td.q{min-width:58px;max-width:64px}
.sheet td.calc{background:var(--soft);text-align:right;padding:0 8px;color:var(--mute);min-width:84px}
.sheet td.ro{background:var(--soft);padding:0 8px;color:var(--ink)}
.sheet td.r{text-align:right}
.sheet tr.unpaid td.st1{box-shadow:inset 4px 0 0 var(--bad)}
.sheet tr.todeliver td.st1{box-shadow:inset 4px 0 0 var(--warn)}
.sheet td.mm .cell{background:color-mix(in srgb,var(--warn) 18%,transparent)}
.sheet .rm{border:0;background:none;color:var(--mute);cursor:pointer;width:32px;height:32px;font-size:16px}
.sheet .rm:hover{color:var(--bad)}
.sheet td.bal{text-align:right;padding:0 8px;min-width:58px}
.sheet td.bal small{display:block;font-size:11px;line-height:1;color:var(--mute)}
.sheet td.bal small.neg{color:var(--bad)}.sheet td.bal small.pos{color:var(--ok)}
.sheet td.txt{padding:0 8px}
.sheet tr.cnt td{background:var(--soft)}
.flagicon{color:var(--bad);font-weight:800;padding:0 6px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}

.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.sc .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05}
.sc.low .n{color:var(--warn)}.sc.out .n{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--other))}
.formula{font-size:13px;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;vertical-align:1px}
.dot.idle{background:var(--warn)}
.when{font-size:12px;color:var(--mute);white-space:nowrap}

#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(8,14,20,.55)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out;max-width:680px;margin:0 auto}
#sheet .panel.widep{max-width:980px}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .panel{animation:none}}
#dlg{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#dlg.open{display:flex}
#dlg .dbg{position:absolute;inset:0;background:rgba(8,14,20,.55)}
#dlg .dbox{position:relative;background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#dlg h2{margin:0 0 6px}
.sh-head{position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-head h1{margin:0}
.x{background:var(--soft);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px}
.f{display:grid;gap:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.l{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:3px}
.l{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:3px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:42px}
textarea.in{min-height:64px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg label{flex:1;text-align:center;padding:10px 6px;cursor:pointer;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{display:block;margin:-10px -6px;padding:10px 6px;background:var(--btn);color:var(--btnink)}
.seg input:disabled+span{opacity:.6}
.seg input:focus-visible+span{outline:3px solid var(--butane);outline-offset:-3px}
.pr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .nm{flex:1;font-weight:600}
.pr .pp{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px}
.pr .lv{font-size:12px;color:var(--mute);width:64px;text-align:right}
.pr .av{font-size:12px;color:var(--mute);width:62px;text-align:right}
.pr .av.low{color:var(--bad);font-weight:700}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{border:0;background:var(--soft);width:38px;height:38px;font-size:20px;cursor:pointer}
.step input{width:52px;text-align:center;border:0;background:transparent;height:38px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.hint{font-size:12px;color:var(--mute);margin-top:3px}
.sticky-foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sticky-foot .btn:last-child{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;z-index:95;font-weight:600;max-width:90vw}
.center{max-width:460px;margin:40px auto;padding:0 16px}
.center .card{padding:20px}
.err{color:var(--bad);font-weight:600;font-size:14px}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}
.prod{display:grid;grid-template-columns:1fr 92px 64px 44px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.prod .in{padding:7px 8px;min-height:36px}
.hd{font-size:12px;color:var(--mute);font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rgrid label{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.rgrid input{width:64px;border:1px solid var(--line);border-radius:6px;padding:5px;text-align:right;margin-left:auto}
.lockline{font-size:12px;color:var(--mute);background:var(--soft);border-radius:8px;padding:8px 10px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.embedded .brand,.embedded .center>p.small{display:none}
.embedded .dnav{margin-left:0}
</style>
</head>

<script>
/* ============================================================
   Rotawise — Gas Deliveries
   Firestore (Rotawise Firebase project). Gas data lives in gas_*
   collections. Access is controlled by firestore.rules.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBGR-i8LHuPHPL4sSCFJCwzYRqgnTSeVH8",
  authDomain: "rotawise-a2b16.firebaseapp.com",
  projectId: "rotawise-a2b16",
  storageBucket: "rotawise-a2b16.firebasestorage.app",
  messagingSenderId: "506340621414",
  appId: "1:506340621414:web:2f5ff84b2ddfef0905c1a7"
};
const COLLECTION_PREFIX='gas_';
const OWNER_UID='5nI7ZEVbX8Uya6Kc2HGeEpu5tFx1';      // the business owner: always admin
const STAFF_DOMAIN='staff.rotawise-gas.app';         // employee logins are code.vN@this (never shown)
const EDIT_WINDOW_MS=30*60*1000;                     // staff can fix their own new entries for 30 minutes
const FIREBASE_VERSION='10.14.1';
const pinPw=pin=>'rwgas-'+pin;
const staffEmail=(code,v)=>`${code}.v${v||1}@${STAFF_DOMAIN}`;
const normCode=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

/* ---------- data layer: this device ---------- */
const mem={};
const Local={
  mode:'local',subs:{},
  read(c){const raw=lsGet('gdt_'+c);if(raw===null)return mem[c]||{};return safe(()=>JSON.parse(raw),{})},
  write(c,o){mem[c]=o;lsSet('gdt_'+c,JSON.stringify(o))},
  sub(c,cb){(this.subs[c]??=[]).push(cb);cb(Object.values(this.read(c)),false);return()=>{this.subs[c]=(this.subs[c]||[]).filter(x=>x!==cb)}},
  subOne(c,id,cb){return this.sub(c,a=>cb(a.find(x=>x.id===id)||null))},
  async patch(c,id,o){const d=this.read(c);if(d[id]){d[id]={...d[id],...clean(o)};this.write(c,d);this.emit(c)}},
  async listRaw(){return[]},
  subQuery(c,o,cb){return this.sub(c,a=>cb(a.sort((x,y)=>(y[o.orderBy]||0)-(x[o.orderBy]||0)).slice(0,o.limit)))},
  subWhere(c,f,op,v,cb){return this.sub(c,a=>cb(a.filter(x=>op==='array-contains'?(x[f]||[]).includes(v):op==='in'?v.includes(x[f]):x[f]===v)))},
  emit(c){(this.subs[c]||[]).forEach(cb=>cb(Object.values(this.read(c))))},
  async put(c,id,o){const d=this.read(c);d[id]={...clean(o),id};this.write(c,d);this.emit(c)},
  async add(c,o){return this.put(c,uid(),o)},
  async del(c,id){const d=this.read(c);delete d[id];this.write(c,d);this.emit(c)},
  async has(c,id){return id in this.read(c)},
  async getOne(c,id){const d=this.read(c)[id];return d?{...d}:null},
  async createLogin(){throw new Error('Employee logins need the online database.')}
};
/* ---------- data layer: Firestore ---------- */
async function makeCloud(cfg){
  const B=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [A,F,Au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
  const app=A.initializeApp(cfg);
  let db;
  try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
  catch(e){db=F.getFirestore(app)}
  const auth=Au.getAuth(app);const P=COLLECTION_PREFIX;
  const docs=s=>s.docs.map(d=>({...d.data(),id:d.id}));
  return{mode:'cloud',
    onAuth:cb=>Au.onAuthStateChanged(auth,cb),
    signIn:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),
    signOut:()=>Au.signOut(auth),
    sub:(c,cb,err)=>F.onSnapshot(F.collection(db,P+c),s=>cb(docs(s),s.metadata.fromCache),err),
    subOne:(c,id,cb,err)=>F.onSnapshot(F.doc(db,P+c,id),s=>cb(s.exists()?{...s.data(),id:s.id}:null),err),
    patch:(c,id,o)=>F.updateDoc(F.doc(db,P+c,id),clean(o)),
    listRaw:async name=>docs(await F.getDocs(F.collection(db,name))),
    subQuery:(c,o,cb,err)=>F.onSnapshot(F.query(F.collection(db,P+c),F.orderBy(o.orderBy,'desc'),F.limit(o.limit)),s=>cb(docs(s)),err),
    subWhere:(c,f,op,v,cb,err)=>F.onSnapshot(F.query(F.collection(db,P+c),F.where(f,op,v)),s=>cb(docs(s)),err),
    getOne:async(c,id)=>{const s=await F.getDoc(F.doc(db,P+c,id));return s.exists()?{...s.data(),id:s.id}:null},
    put:(c,id,o)=>F.setDoc(F.doc(db,P+c,id),clean(strip(o))),
    add:(c,o)=>F.addDoc(F.collection(db,P+c),clean(o)),
    del:(c,id)=>F.deleteDoc(F.doc(db,P+c,id)),
    has:async(c,id)=>{const r=F.doc(db,P+c,id);try{return (await F.getDocFromCache(r)).exists()}catch{return (await F.getDoc(r)).exists()}},
    async createLogin(email,pw){
      const sec=A.getApps().find(a=>a.name==='staff-creator')||A.initializeApp(cfg,'staff-creator');
      const sa=Au.getAuth(sec);const cr=await Au.createUserWithEmailAndPassword(sa,email,pw);
      const id=cr.user.uid;await Au.signOut(sa);return id;
    }
  };
}
function cloudConfig(){

}

/* ---------- boot & sign-in ---------- */
let unsubs=[],hb=null;
function detach(){unsubs.forEach(u=>{try{u()}catch{}});unsubs=[];clearInterval(hb);hb=null;
  Object.assign(S,{orders:[],stock:[],settings:null,audit:[],presence:[],staff:[],team:[],reminders:[],adminCfg:null,mig:{},staffLive:false,teamLive:false})}
function attach(){
  const err=e=>{S.err=e.message||String(e);toast('Sync problem: '+S.err)};
  const on=(c,k,f,after)=>unsubs.push(store.sub(c,(a,fc)=>{S[k]=f?f(a):a;if(after)after(a,fc);render()},err));
  if(limited()){
    /* employee kept to their stores: one live query per store (the database refuses anything else) */
    const parts={orders:{},stock:{}};
    ['orders','stock'].forEach(c=>S.me.stores.slice(0,10).forEach(id=>unsubs.push(store.subWhere(c,'storeId','==',id,a=>{parts[c][id]=a;S[c]=Object.values(parts[c]).flat();render()},err))));
  }else{on('orders','orders',null,(a,fc)=>migrate('orders',a,fc));on('stock','stock',null,(a,fc)=>migrate('stock',a,fc))}
  on('settings','settings',a=>a.find(x=>x.id==='main')||null);
  if(isManager()){unsubs.push(store.subQuery('audit',{orderBy:'at',limit:300},a=>{S.audit=a;render()},err));on('presence','presence');on('reminders','reminders');
    unsubs.push(store.sub('team',(a,fc)=>{S.team=a;if(!fc)S.teamLive=true;syncTeam();render()},()=>{}))}
  if(isAdmin()){on('staff','staff',null,(a,fc)=>{if(!fc)S.staffLive=true;syncTeam()});on('admin','adminCfg',a=>a.find(x=>x.id==='config')||null)}
  /* employees: if the admin switches the login off or changes role/stores, apply it straight away */
  if(!isAdmin()&&S.me&&store.subOne)unsubs.push(store.subOne('staff',S.me.uid,d=>{
    if(!d||d.active!==true){S.loginErr='Your login was switched off. Ask your admin.';store.signOut&&store.signOut();return}
    const ns=Array.isArray(d.stores)?d.stores:[];
    if((d.role||'staff')!==S.me.role||JSON.stringify(ns)!==JSON.stringify(S.me.stores||[])||(d.name&&d.name!==S.me.name)){
      Object.assign(S.me,{role:d.role||'staff',stores:ns,name:d.name||S.me.name,email:d.email||''});detach();attach();render()}
  },()=>{}));
  if(!isManager()&&S.me)unsubs.push(store.subWhere('reminders','toUids','array-contains',S.me.uid,a=>{S.reminders=a;render()},()=>{}));
  if(store.mode==='cloud'&&!isAdmin()){beat();hb=setInterval(beat,45000)}
}
function beat(){if(!S.me||isAdmin()||store.mode!=='cloud')return;
  write(()=>store.put('presence',S.me.uid,{code:S.me.code,name:S.me.name,role:S.me.role,view:S.view,store:allStores().length>1&&curStore()!=='all'?storeName(curStore()):'',lastSeen:Date.now()}))}
/* orders and stock saved before stores existed belong to the first store (admin does this once, from fresh server data only) */
function migrate(c,a,fromCache){
  if(!isAdmin()||fromCache||S.mig[c])return;S.mig[c]=true;
  a.filter(x=>!x.storeId).forEach(x=>write(()=>store.patch(c,x.id,{storeId:'main'})));
}
/* gas_team: names, codes and stores (no emails) so managers can send reminders to employees */
function syncTeam(){
  if(!isAdmin()||store.mode!=='cloud'||!S.staffLive||!S.teamLive)return;
  clearTimeout(syncTeam.t);syncTeam.t=setTimeout(()=>{
    const want={};S.staff.filter(s=>!s.replacedBy&&!s.owner).forEach(s=>want[s.id]={name:s.name||'',code:s.code||'',role:s.role||'staff',stores:s.stores||[],active:s.active===true,hasEmail:!!s.email});
    const key=t=>JSON.stringify([t.name,t.code,t.role,t.stores||[],!!t.active,!!t.hasEmail]);
    Object.entries(want).forEach(([id,t])=>{const cur=S.team.find(x=>x.id===id);if(!cur||key(cur)!==key(t))write(()=>store.put('team',id,t))});
    S.team.filter(t=>!want[t.id]).forEach(t=>write(()=>store.del('team',t.id)));
  },400);
}
async function identify(u){
  if(u.uid===OWNER_UID){
    try{if(!(await store.getOne('staff',u.uid)))await store.put('staff',u.uid,{code:'admin',name:'Admin',role:'admin',active:true,owner:true,createdAt:Date.now()})}catch{}
    return{uid:u.uid,code:'admin',name:'Admin',role:'admin'};
  }
  const d=await store.getOne('staff',u.uid);
  if(!d||d.active!==true)throw new Error('This login is switched off. Ask your admin.');
  return{uid:u.uid,code:d.code,name:d.name,role:d.role||'staff',email:d.email||'',stores:Array.isArray(d.stores)?d.stores:[]};
}
async function boot(){
  const cfg=cloudConfig();
  if(cfg&&lsGet('gdt_mode')!=='local'){
    try{
      store=await makeCloud(cfg);
      store.onAuth(async u=>{
        detach();
        if(!u){S.me=null;S.boot='login';render();return}
        try{S.me=await identify(u)}catch(e){S.loginErr=e.message;S.me=null;await store.signOut();return}
        S.loginErr='';S.boot='ready';attach();render();
      });
    }catch(e){S.boot='error';S.err='Could not load Firebase ('+(e.message||e)+'). Check your connection.'}
  }else if(lsGet('gdt_mode')==='local'){store=Local;S.me=safe(()=>JSON.parse(lsGet('gdt_localme')),null)||{uid:'local',code:'you',name:'You',role:'admin',stores:[]};S.boot='ready';attach()}
  else S.boot='setup';
  render();
}
async function doLogin(f){
  const err=m=>{$('#lerr').textContent=m};err('');
  const b=f.querySelector('[type=submit]');b.disabled=true;
  try{
    if(S.loginTab==='admin')await store.signIn(f.elements.em.value.trim(),f.elements.pw.value);
    else{
      const code=normCode(f.elements.code.value),pin=f.elements.pin.value.trim();
      if(!code||!/^\d{4,8}$/.test(pin)){err('Enter your employee code and your 4–8 digit PIN.');return}
      const L=await store.getOne('logins',code);
      if(!L){err('That employee code is not set up. Ask your admin.');return}
      await store.signIn(staffEmail(code,L.v),pinPw(pin));
    }
  }catch(e){err(S.loginTab==='admin'?'Could not sign in. Check the email and password.':'Wrong code or PIN.')}
  finally{b.disabled=false}
}

/* ---------- audit trail ---------- */
const FIELD_LABEL={storeId:'Store',orderNo:'Order ID',date:'Date',customer:'Customer',phone:'Phone',address:'Address',postcode:'Postcode',items:'Cylinders',amount:'Amount',payStatus:'Payment',delStatus:'Delivery',method:'Method',notes:'Notes'};
const itemsText=items=>{const e=Object.entries(items||{}).filter(([,q])=>q);return e.length?e.map(([id,q])=>`${q}×${pById(id)?.label||id}${pById(id)?' '+pById(id).group:''}`).join(', '):'none'};
const fmtVal=(k,v)=>k==='amount'?money(v):k==='date'?fdate(v):k==='storeId'?storeName(v):(v===''||v==null?'—':String(v));
function diffSummary(a,b){const out=[];for(const k of Object.keys(FIELD_LABEL)){const g=o=>k==='items'?itemsText(o[k]):k==='storeId'?sid(o):o[k];const x=g(a),y=g(b);
  if(String(x??'')!==String(y??''))out.push(`${FIELD_LABEL[k]}: ${fmtVal(k,x)} → ${fmtVal(k,y)}`)}return out.join('; ')}
function audit(action,entity,id,summary,before,after,storeId){
  if(!S.me)return;
  write(()=>store.add('audit',{at:Date.now(),action,entity,entityId:id||'',summary:summary||'',byUid:S.me.uid,by:byMe(),storeId:storeId||'',
    before:before?strip(before):null,after:after?strip(after):null}));
}
const ref=o=>`${o.orderNo||''} ${o.customer||''}`.trim();
const sPre=x=>allStores().length>1?`[${storeName(sid(x))}] `:'';
function commitOrder(o,old,verb){
  write(()=>store.put('orders',o.id,o));
  if(!old)audit(verb||'Added order','order',o.id,`${sPre(o)}${ref(o)} · ${itemsText(o.items)} · ${money(o.amount)} · ${o.payStatus}`,null,o,sid(o));
  else{const d=diffSummary(old,o);if(d||verb)audit(verb||'Edited order','order',o.id,`${sPre(o)}${ref(o)}${d?': '+d:''}`,old,o,sid(o))}
}
function commitStock(e,old,verb){
  write(()=>store.put('stock',e.id,e));
  audit(verb||(old?'Edited stock':'Added stock'),'stock',e.id,`${sPre(e)}${kinds[e.type]||e.type} ${fdate(e.date)} · ${itemsText(e.items)}`,old,e,sid(e));
}

/* ---------- formulas (mirror the spreadsheet) ---------- */
const cmpOrders=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0);
const cmpAsc=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0);
const listTotal=items=>r2(Object.entries(items||{}).reduce((t,[id,q])=>t+(pById(id)?.price||0)*q,0));
function inPeriod(o){
  if(S.period==='all')return true;
  if(S.period==='today')return o.date===today();
  if(S.period==='month')return (o.date||'').slice(0,7)===today().slice(0,7);
  const d=new Date();d.setDate(d.getDate()-6);return (o.date||'')>=isoOf(d);
}
const kinds={count:'Stock count',in:'Delivery stock in',cage:'Cage filled',adjust:'Adjustment',order:'Order'};
/* Stock = last count − delivered − cage filled ± adjustments + delivery stock in (Excel CURRENT STOCK) */
function ledger(st){
  const ev=[];
  S.stock.filter(e=>!e.deleted&&sid(e)===st).forEach(e=>ev.push({date:e.date||'',rank:{count:0,in:1,adjust:2,cage:3}[e.type]??3,ts:e.createdAt||0,kind:e.type,ref:e,items:e.items||{}}));
  S.orders.forEach(o=>{if(!o.deleted&&sid(o)===st&&o.delStatus==='Delivered'&&Object.keys(o.items||{}).length)ev.push({date:o.date||'',rank:4,ts:o.createdAt||0,kind:'order',ref:o,items:o.items})});
  ev.sort((a,b)=>a.date.localeCompare(b.date)||a.rank-b.rank||a.ts-b.ts);
  const first=ev.findIndex(x=>x.kind==='count');
  const run=first<0?ev:ev.slice(first);
  const bal={};const rows=[];let counted=false;
  products().forEach(p=>bal[p.id]=0);
  for(const x of run){
    const ch={};
    if(x.kind==='count'){products().forEach(p=>{const v=x.items[p.id]||0;if(counted&&v!==bal[p.id])ch[p.id]=v-bal[p.id];bal[p.id]=v});counted=true}
    else{const sign=x.kind==='in'||x.kind==='adjust'?1:-1;
      Object.entries(x.items).forEach(([id,q])=>{if(!(id in bal))bal[id]=0;ch[id]=sign*q;bal[id]+=sign*q})}
    rows.push({...x,ch,bal:{...bal}});
  }
  return{rows,bal,hasCount:first>=0,lastCount:[...rows].reverse().find(r=>r.kind==='count')||null};
}
/* each store has its own stock; All stores adds them up */
function stockFor(st){
  const L=ledger(st);const commit={};
  S.orders.forEach(o=>{if(!o.deleted&&sid(o)===st&&o.delStatus!=='Delivered')Object.entries(o.items||{}).forEach(([id,q])=>commit[id]=(commit[id]||0)+q)});
  return{L,now:L.bal,commit,id:st};
}
function stockNow(){
  const c=curStore();if(c!=='all')return stockFor(c);
  const per=visIds().map(stockFor);if(per.length===1)return per[0];
  const now={},commit={},lc={};let any=false;
  per.forEach(s=>{Object.entries(s.now).forEach(([k,v])=>now[k]=(now[k]||0)+v);Object.entries(s.commit).forEach(([k,v])=>commit[k]=(commit[k]||0)+v);
    const l=s.L.lastCount;if(l){any=true;Object.entries(l.items||{}).forEach(([k,v])=>lc[k]=(lc[k]||0)+v)}});
  return{L:{rows:[],bal:now,hasCount:any,lastCount:any?{items:lc,date:''}:null},now,commit,per,id:'all'};
}

function askConfirm({title,body='',ok='OK',danger=false}){
  return new Promise(res=>{
    const d=$('#dlg');

      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn sec" data-dlg="0">Cancel</button><button class="btn ${danger?'dangerf':''}" data-dlg="1">${esc(ok)}</button></div></div>`;
    d.classList.add('open');
    const done=v=>{d.classList.remove('open');d.innerHTML='';document.removeEventListener('keydown',key,true);res(v)};
    const key=e=>{if(e.key==='Escape'){e.stopPropagation();done(false)}};
    document.addEventListener('keydown',key,true);
    d.querySelectorAll('[data-dlg]').forEach(b=>b.onclick=()=>done(b.dataset.dlg==='1'));
    d.querySelector('.dbg').onclick=()=>done(false);

/* ---------- render (keeps the cursor where it was) ---------- */
let typingKey=null,restoring=false;
function render(){
  const app=$('#app');
  const ae=document.activeElement;let fk=null,fv,ss,se;
  if(ae&&ae.dataset&&ae.dataset.k&&app.contains(ae)){fk=ae.dataset.k;fv=ae.value;try{ss=ae.selectionStart;se=ae.selectionEnd}catch{}}
  const sx=$('.tablewrap')?.scrollLeft,sy=$('.tablewrap')?.scrollTop;
  app.innerHTML=view();
  const tw=$('.tablewrap');if(tw&&sx!=null){tw.scrollLeft=sx;tw.scrollTop=sy}
  const key=S.focusKey||fk;
  if(key){
    const el=app.querySelector(`[data-k="${CSS.escape(key)}"]`);
    if(el){
      const mid=!S.focusKey&&key===typingKey;
      if(mid&&fv!==undefined&&el.tagName!=='SELECT'&&el.value!==fv)el.value=fv;
      restoring=true;el.focus({preventScroll:!S.focusKey});restoring=false;
      try{if(mid&&ss!=null)el.setSelectionRange(ss,se);else if(el.classList.contains('cell')&&el.select)el.select()}catch{}
      if(S.focusKey)el.scrollIntoView({block:'nearest',inline:'nearest'});
    }
    S.focusKey=null;
  }
}

function filteredOrders(asc){
  const f=S.f,q=f.q.trim().toLowerCase();
  return S.orders.filter(o=>{
    if(f.deleted?!o.deleted:o.deleted)return false;
    if(!inStore(o))return false;
    if(f.flag&&!(o.flag&&o.flag.open))return false;
    if(f.pay!=='all'&&o.payStatus!==f.pay)return false;
    if(f.del!=='all'&&o.delStatus!==f.del)return false;
    if(f.from&&(o.date||'')<f.from)return false;
    if(f.to&&(o.date||'')>f.to)return false;
    if(q&&![o.customer,o.postcode,o.address,o.phone,o.orderNo,o.notes].some(x=>String(x||'').toLowerCase().includes(q)))return false;
    return true;
  }).sort(asc?cmpAsc:cmpOrders);
}

function updateCell(id,k,val){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  if((k.startsWith('q:')||LOCKED.includes(k))&&!canEditLocked(o)){toast('Only a manager can change that. Use Flag a doubt.');render();return}
  const n={...o,items:{...(o.items||{})},updatedAt:Date.now(),updatedBy:byMe()};
  if(k.startsWith('q:')){
    const pid=k.slice(2),q=Math.max(0,Math.floor(+val||0));const before=listTotal(o.items);
    if(q)n.items[pid]=q;else delete n.items[pid];
    if(!Number(o.amount)||Math.abs((Number(o.amount)||0)-before)<0.01)n.amount=listTotal(n.items);
  }else if(k==='amount')n.amount=val===''?0:r2(val);
  else if(k==='storeId')n.storeId=val;
  else if(k==='postcode')n.postcode=val.trim().toUpperCase();
  else n[k]=String(val).trim();
  if(k==='customer'){
    const prev=[...live()].sort(cmpOrders).find(x=>x.id!==id&&(x.customer||'').trim().toLowerCase()===n.customer.toLowerCase());
    if(prev)['phone','address','postcode'].forEach(f=>{if(!n[f])n[f]=prev[f]||''});
  }
  if(JSON.stringify(n.items)===JSON.stringify(o.items||{})&&Object.keys(FIELD_LABEL).every(f=>f==='items'||n[f]===o[f]))return;
  setTimeout(()=>commitOrder(n,o),0);
}

function customerList(){

}

const REP={none:'Once',daily:'Every day',weekly:'Every week',monthly:'Every month'};
function remRow(r){
  const m=isManager(),due=(r.nextAt||'')<=nowLocal();
  const st=r.storeId&&allStores().length>1?`<span class="stag">${esc(storeName(r.storeId))}</span> `:'';
  const own=r.createdByUid&&r.createdByUid===S.me?.uid;
  const line=m?`For: ${esc(recipText(r))}${!own&&r.createdBy?' · set by '+esc(whoLabel(r.createdBy)):''}`
    :own?`Your reminder${r.toOwner?' · managers reminded too':''}`:'From your manager';
  return`<div class="li"><div class="grow">${st}<b style="${due?'color:var(--bad)':''}">${esc(r.title)}</b>
    <div class="meta">${fwhen(r.nextAt)} · ${REP[r.repeat||'none']}${r.note?' · '+esc(r.note):''}${r.sentFor===r.nextAt?' · emailed':''}</div>
    <div class="meta">${line}</div></div>
    <div class="row">${due?`<button class="btn sm" data-act="reminder-done" data-id="${esc(r.id)}">Done</button>`:''}${canEditRem(r)?`<button class="btn sm sec" data-act="reminder-edit" data-id="${esc(r.id)}">Edit</button>`:''}</div></div>`;
}
function remindersHtml(){
  const m=isManager();const byAt=(a,b)=>(a.nextAt||'').localeCompare(b.nextAt||'');

function openSheet(html,wide){const s=$('#sheet');s.innerHTML=`<div class="bg" data-act="close-sheet"></div><div class="panel ${wide?'widep':''}">${html}</div>`;s.classList.add('open');document.body.classList.add('lock')}

function nextOrderNo(st){const pf=storePrefix(st||defStore());const re=new RegExp('^'+pf+'-(\\d+)$');let m=0;S.orders.forEach(o=>{const x=re.exec(o.orderNo||'');if(x)m=Math.max(m,+x[1])});return pf+'-'+String(m+1).padStart(4,'0')}

function formItems(f,prefix,signed){const items={};products().forEach(p=>{const el=f.elements[prefix+p.id];const q=el?Math.trunc(+el.value||0):0;if(signed?q!==0:q>0)items[p.id]=q});return items}
function calcOrderForm(){
  const f=$('#oform');if(!f)return;
  const items=formItems(f,'q_');const t=listTotal(items);
  products().forEach(p=>{const el=$('#lv_'+p.id);if(el)el.textContent=items[p.id]?money(items[p.id]*p.price):''});
  const amt=f.elements.amount;
  if(f.dataset.touched!=='1'&&!amt.disabled)amt.value=t?t.toFixed(2):'';
  const diff=t&&Math.abs(t-(+amt.value||0))>0.009;
  const over=products().filter(p=>{const a=$('#av_'+p.id);return a&&items[p.id]&&items[p.id]>parseInt(a.textContent)}).map(p=>pName(p));
  $('#o-hint').innerHTML=(t?`Value at list price ${money(t)}${diff&&!amt.disabled?` · <a href="#" data-act="use-list" style="font-weight:700">Use list price</a>`:''}`:'')+(over.length?`<div class="t-bad" style="font-weight:600">More than in stock: ${esc(over.join(', '))}</div>`:'');
}
function saveOrder(f){
  const v=n=>(f.elements[n]?f.elements[n].value:'').trim();
  const old=f.dataset.id?S.orders.find(x=>x.id===f.dataset.id):null;
  const lock=!!old&&!canEditLocked(old);
  const sale=f.dataset.sale==='1';
  if(!lock&&(!v('customer')||!v('date')))return toast('Add a customer and a date');
  const st=f.elements.storeId?.value||(old?sid(old):defStore());
  const base=old||newOrderBase(st);
  const o={...base,phone:v('phone'),postcode:v('postcode').toUpperCase(),notes:v('notes'),updatedAt:Date.now()};
  if(f.elements.address)o.address=v('address');
  o.delStatus=sale?'Delivered':(f.elements.delStatus?.value||base.delStatus);
  if(!lock){Object.assign(o,{storeId:st,orderNo:v('orderNo')||nextOrderNo(st),date:v('date'),customer:v('customer'),items:formItems(f,'q_'),amount:r2(f.elements.amount.value),
    payStatus:f.elements.payStatus.value,method:f.elements.method.value})}
  if(sale)o.source='sale';
  if(old)o.updatedBy=byMe();
  if(!Object.keys(o.items||{}).length&&!old&&sale)return toast('Add at least one cylinder');
  lsSet('gdt_laststore',sid(o));
  closeSheet();toast(old?'Order saved':sale?'Sale saved, stock updated':'Order added');
  commitOrder(o,old,sale&&!old?'Counter sale':null);
}

async function saveStaff(f){
  const err=m=>{$('#sterr').textContent=m};
  const s=f.dataset.id?S.staff.find(x=>x.id===f.dataset.id):null;
  const name=f.elements.name.value.trim(),role=f.elements.role.value,pin=f.elements.pin.value.trim(),email=f.elements.email.value.trim();
  const stores=allStores().filter(x=>f.elements['store_'+x.id]?.checked).map(x=>x.id);
  if(!name)return err('Enter a name.');
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('That email address does not look right.');
  if(pin&&!/^\d{4,8}$/.test(pin))return err('PIN must be 4–8 digits.');
  const btn=f.querySelector('[type=submit]');btn.disabled=true;
  try{
    if(!s){
      const code=normCode(f.elements.code.value);
      if(!/^[a-z0-9]{2,20}$/.test(code))return err('Code must be 2–20 letters or numbers.');
      if(code==='admin')return err('Choose a different code.');
      if(await store.getOne('logins',code))return err('That code is already used.');
      S.pending={mode:'new',code,name,role,pin,email,stores,v:1};
      const nu=await store.createLogin(staffEmail(code,1),pinPw(pin));
      await finishStaff(nu);
      closeSheet();toast(`Login created for ${name}: code ${code}`);
    }else{
      const active=!!f.elements.active?.checked;
      if(pin){
        const v=(s.v||1)+1;
        S.pending={mode:'pin',code:s.code,name,role,active,pin,email,stores,v,old:s};
        const nu=await store.createLogin(staffEmail(s.code,v),pinPw(pin));
        await finishStaff(nu);
      }else{
        await store.put('staff',s.id,{...strip(s),name,role,active,email,stores});
        const ch=[s.name!==name?`name → ${name}`:'',s.role!==role?`role → ${ROLE_LABEL[role]}`:'',s.active!==active?(active?'switched on':'switched off'):'',(s.email||'')!==email?'email updated':'',
          JSON.stringify(s.stores||[])!==JSON.stringify(stores)?`stores → ${stores.length?stores.map(storeName).join(', '):'all'}`:''].filter(Boolean).join(', ');
        if(ch)audit('Updated employee','staff',s.id,`${s.name} (${s.code}): ${ch}`);
      }
      closeSheet();toast('Saved');
    }
  }catch(e){
    if(/admin-restricted|operation-not-allowed/.test((e.code||'')+(e.message||''))&&S.pending){closeSheet();manualLoginSheet();return}
    err(e.message||String(e));
  }
  finally{btn.disabled=false}
}

function loadScript(src,check){
  if(check())return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('Could not load '+src+'. Check your connection.'));document.head.appendChild(s)});
}

const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDate(v){
  if(v==null||v==='')return'';
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  if(v instanceof Date)return isoOf(v);
  const s=String(v).trim();let m;
  if((m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return`${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2,4})/.exec(s)))return`${m[3].length===2?'20'+m[3]:m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if((m=/(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]{3})[a-z]*\.?,?\s+(\d{4})/i.exec(s))&&MONTHS.includes(m[2].toLowerCase()))return`${m[3]}-${pad(MONTHS.indexOf(m[2].toLowerCase())+1)}-${pad(m[1])}`;
  return'';
}
const normPay=s=>{s=String(s||'').trim().toLowerCase();return s==='paid'?'Paid':s==='account'?'Account':'Not Paid'};
const normDel=s=>{s=String(s||'').trim().toLowerCase();return s==='delivered'?'Delivered':'Not Delivered'};
const normMethod=s=>{s=String(s||'').trim();const m=METHODS.find(x=>x&&x.toLowerCase()===s.toLowerCase());return m||s};
function matchProduct(grp,h){
  const g=String(grp).trim().toLowerCase(),hs=String(h).trim().toLowerCase(),hn=parseFloat(h);
  return products().find(p=>p.group.toLowerCase()===g&&(String(p.label).toLowerCase()===hs||(!isNaN(hn)&&parseFloat(p.label)===hn)));
}
/* loose match for any header or text line: "47kg Propane", "PROPANE 47", "Patio Gas 13kg", "Camping Gaz 907" */
function matchLoose(text){
  const t=String(text||'').toLowerCase().replace(/\s+/g,' ').trim();if(!t)return null;
  const exact=products().find(p=>pName(p).toLowerCase()===t);if(exact)return exact;
  const g=/propane/.test(t)?'Propane':/butane/.test(t)?'Butane':/patio/.test(t)?'Patio':/(camping|gaz)/.test(t)?'Camping Gas':null;

  for(const sz of sizes.sort((a,b)=>(b.kg?1:0)-(a.kg?1:0))){
    let c=products().filter(p=>parseFloat(p.label)===sz.n&&(sz.kg||g||/^\d+(\.\d+)?$/.test(t)||p.group==='Camping Gas'));
    if(g)c=c.filter(p=>p.group===g);
    if(c.length===1)return c[0];
    if(c.length>1)return c.find(p=>p.group==='Propane')||c[0];
  }
  const lbl=products().find(p=>isNaN(parseFloat(p.label))&&t.includes(p.label.toLowerCase()));

function parseTrackerStock(X,ws){
  if(!ws||!ws['!ref'])return[];
  const rg=X.utils.decode_range(ws['!ref']);const maxC=rg.e.c+1,maxR=rg.e.r+1;
  const V=(r,c)=>{const x=ws[X.utils.encode_cell({r:r-1,c:c-1})];return x?x.v:undefined};
  const T=(r,c)=>String(V(r,c)??'').trim();
  let hr=0;for(let r=1;r<=12&&!hr;r++)if(/^customer/i.test(T(r,3)))hr=r;
  if(!hr)return[];
  const qcols=[];let grp='';
  for(let c=12;c<=maxC;c++){const g=T(hr-1,c);if(/total/i.test(g))break;if(g)grp=g;const h=V(hr,c);if(h===undefined||h==='')break;qcols.push({c,p:matchProduct(grp,h)})}
  const findCol=(row,re)=>{for(let c=1;c<=maxC;c++)if(re.test(T(row,c)))return c;return 0};
  const block=(c0,r)=>{const items={};qcols.forEach((q,i)=>{const raw=V(r,c0+i);const v=Number(raw);if(q.p&&raw!==undefined&&raw!==''&&!isNaN(v))items[q.p.id]=Math.floor(v)});return items};
  const any=o=>Object.values(o).some(v=>v>0);
  const out=[];
  const cur=findCol(1,/current\s*stock/i),cage=findCol(1,/cage/i),dlv=findCol(1,/delivery\s*stock/i);
  const dcol=findCol(hr-1,/^date$/i);const sdate=dcol?parseDate(V(hr+1,dcol)):'';
  if(cur&&sdate){const it=block(cur,hr+1);if(any(it))out.push({type:'count',date:sdate,items:it,notes:'Current stock from spreadsheet'})}
  if(cage&&sdate){const it=block(cage,hr+1);if(any(it))out.push({type:'cage',date:sdate,items:it,notes:'Cage filled from spreadsheet'})}
  if(dlv){for(let r=hr+2;r<=maxR;r++){const d=parseDate(V(r,dlv-1));if(!d)continue;const it=block(dlv,r);Object.keys(it).forEach(k=>{if(!it[k])delete it[k]});if(any(it))out.push({type:'in',date:d,items:it,notes:'Delivery stock from spreadsheet'})}}
  return out;
}
function parseStockSheet(X,ws){
  const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>/^type$/i.test(String(c).trim()))&&r.some(c=>/^date$/i.test(String(c).trim())));
  if(hi<0)return[];
  const head=rows[hi].map(x=>String(x||'').trim());
  const ti=head.findIndex(h=>/^type$/i.test(h)),di=head.findIndex(h=>/^date$/i.test(h)),ni=head.findIndex(h=>/^notes?$/i.test(h)),si=head.findIndex(h=>/^store$/i.test(h));
  const pc=head.map(h=>matchLoose(h));
  const tmap=s=>{s=String(s||'').toLowerCase();return/count/.test(s)?'count':/cage/.test(s)?'cage':/adjust/.test(s)?'adjust':/(in|deliver|receiv|supplier)/.test(s)?'in':''};
  const out=[];
  rows.slice(hi+1).forEach(r=>{const t=tmap(r[ti]);const d=parseDate(r[di]);if(!t||!d)return;const items={};
    pc.forEach((p,i)=>{if(!p||i===ti||i===di)return;const v=r[i];if(v===''||v==null)return;const q=Math.trunc(Number(v));if(isNaN(q))return;if(t==='adjust'?q!==0:(t==='count'||q>0))items[p.id]=q});
    if(Object.keys(items).length)out.push({type:t,date:d,items,notes:ni>=0?String(r[ni]||'').trim():'',storeName:si>=0?String(r[si]||'').trim():''})});
  return out;
}
function parseGenericStock(X,ws){
  const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  for(let hi=0;hi<Math.min(rows.length,15);hi++){
    let carry='';const above=rows[hi-1]||[];
    const labels=rows[hi].map((c,i)=>{const a=String(above[i]||'').trim();if(a&&!/date/i.test(a))carry=a;return`${carry} ${String(c||'').trim()}`.trim()});
    const pc=rows[hi].map((c,i)=>String(c).trim()?matchLoose(labels[i])||matchLoose(c):null);
    if(pc.filter(Boolean).length<2)continue;
    const di=rows[hi].findIndex(c=>/date/i.test(String(c)));
    const out=[];
    for(const r of rows.slice(hi+1)){
      const items={};pc.forEach((p,i)=>{if(!p)return;const q=Math.trunc(Number(r[i]));if(!isNaN(q)&&q>0)items[p.id]=(items[p.id]||0)+q});
      if(Object.keys(items).length)out.push({type:'in',date:di>=0?parseDate(r[di])||today():today(),items,notes:''});
    }
    return out;
  }
  return[];
}
async function parseStockExcel(file){

function parseStockLines(lines){
  const items={},found=[];let date='';
  for(const raw of lines){
    if(!date){const d=parseDate(raw);if(d&&/date|delivered|invoice|note|dispatch/i.test(raw))date=d}
    const t=raw.toLowerCase();
    if(!/(propane|butane|patio|camping|gaz|\d\s*kg\b|\bkg\b|\b90[47]\b)/.test(t))continue;
    if(/(empty|empties|returned|return|collected)/.test(t))continue;
    const p=matchLoose(t);if(!p)continue;
    const size=String(parseFloat(p.label)).replace('.','\\.');
    const rest=raw.replace(new RegExp('(^|[^\\d.])'+size+'\\s*(kg)?(?![\\d.])','gi'),'$1 ');
    const qm=rest.match(/(?:qty|quantity)\s*[:\-]?\s*(\d{1,3})\b/i)||rest.match(/\b(\d{1,3})\s*(?:x|×|cyl|cylinders?|units?|pcs?)\b/i)||rest.match(/(?:^|\s)[x×]\s*(\d{1,3})\b/i);
    let q=qm?+qm[1]:null;
    if(q==null){const nums=[...rest.matchAll(/(?<![A-Za-z\d.,£$€\/])(\d{1,3})(?![A-Za-z\d.,%\/])/g)].map(m=>+m[1]);q=nums.find(n=>n>0)}
    if(q&&q>0&&q<1000){items[p.id]=(items[p.id]||0)+q;found.push({line:raw.trim(),product:pName(p),qty:q})}
  }
  if(!date)for(const raw of lines){const d=parseDate(raw);if(d){date=d;break}}
  return{items,found,date};
}
async function parseStockPdf(file){
  const pdfjs=await loadPdfJs();
  const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[];
  for(let n=1;n<=pdf.numPages;n++){
    const tc=await (await pdf.getPage(n)).getTextContent();const rows={};
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/4);(rows[y]??=[]).push({x:it.transform[4],s:it.str})});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(rows[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()));
  }
  const r=parseStockLines(lines);
  return{...r,lineCount:lines.length};
}

function saveStore(f){

  S.rw=rw;
  openSheet(`${sheetHead('Add stores from Rotawise')}<form id="rwform" class="f">
   <div class="card" style="padding:4px 12px">${rw.map(r=>`<label class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><input type="checkbox" name="rw_${esc(r.id)}" ${have(r)?'disabled':'checked'}> <b>${esc(r.name)}</b> <span class="muted small">${have(r)?'already added':esc(r.address||'')}</span></label>`).join('')}</div>
   ${fresh&&rw.some(r=>!have(r))?`<div><label class="l" for="rw-main">The gas orders and stock you already have are from</label><select class="in" id="rw-main" name="main"><option value="">Keep them in "${esc(list[0].name)}"</option>${rw.filter(r=>!have(r)).map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select>
    <div class="hint">Pick the shop and "${esc(list[0].name)}" becomes that shop. Nothing is moved and order IDs stay the same.</div></div>`:''}
   <div class="sticky-foot"><button class="btn" type="submit">Add stores</button></div></form>`);
}
function saveRwStores(f){
  const list=allStores().map(x=>({...x}));const mainTo=f.elements.main?.value||'';let n=0;
  (S.rw||[]).forEach(r=>{const el=f.elements['rw_'+r.id];if(!el||el.disabled)return;
    const nm=String(r.name).trim();
    if(r.id===mainTo){Object.assign(list.find(x=>x.id==='main'),{name:nm,rwId:r.id,address:r.address||''});n++;return}
    if(!el.checked)return;
    list.push({id:'rw'+String(r.id).replace(/[^A-Za-z0-9]/g,'').slice(0,12),name:nm,prefix:uniqPrefix(nm,list),address:r.address||'',rwId:r.id,active:true});n++});
  if(!n){closeSheet();return toast('Nothing to add')}
  saveSettingsDoc({stores:list});audit('Added stores from Rotawise','settings','main',list.map(x=>x.name).join(', '));
  closeSheet();toast(`Stores ready: ${list.filter(x=>x.active!==false).map(x=>x.name).join(', ')}`);
}
function write(fn){try{Promise.resolve(fn()).catch(e=>toast(/permission/i.test(e.message||'')?'Not allowed: only a manager can do that.':'Could not save: '+(e.message||e)))}catch(e){toast('Could not save: '+(e.message||e))}}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='noop'){ev.stopPropagation();return}
  if(a==='prod-edit')return;
  if(t.tagName==='A')ev.preventDefault();
  const find=()=>S.orders.find(x=>x.id===id);
  switch(a){
    case'nav':closeSheet();S.view=t.dataset.v;render();scrollTo(0,0);beat();break;
    case'login-tab':S.loginTab=t.dataset.v;S.loginErr='';render();break;
    case'store':S.store=t.dataset.v;lsSet('gdt_store',S.store);render();beat();break;
    case'store-new':storeSheet();break;
    case'store-edit':storeSheet(id);break;
    case'rw-stores':rwStoresSheet();break;
    case'period':S.period=t.dataset.v;render();break;
    case'filter':S.f[t.dataset.k]=t.dataset.v;render();break;
    case'toggle-f':S.f[t.dataset.k]=!S.f[t.dataset.k];render();break;
    case'ov':S.ov=t.dataset.v;lsSet('gdt_ov',S.ov);render();break;
    case'sv':S.sv=t.dataset.v;render();break;
    case'act-who':S.act.who=t.dataset.v;render();break;
    case'show-unpaid':S.f={q:'',pay:'Not Paid',del:'all',flag:false,deleted:false,from:'',to:''};S.view='orders';render();scrollTo(0,0);break;
    case'cust-orders':S.f={q:t.dataset.v,pay:'all',del:'all',flag:false,deleted:false,from:'',to:''};S.ov='cards';S.view='orders';render();scrollTo(0,0);break;
    case'cust-new':orderSheet(null,{customer:t.dataset.v});break;
    case'new-order':orderSheet();break;
    case'sale':orderSheet(null,{sale:true});break;
    case'edit-order':orderSheet(id);break;
    case'add-row':addRow();break;
    case'flag':flagSheet(id);break;
    case'flag-reason':{const ta=$('#fl-r');ta.value=t.dataset.v+(ta.value?'. '+ta.value:'');ta.focus();break}
    case'resolve-flag':resolveSheet(id);break;
    case'remind-order':{const o=find();if(o)reminderSheet(null,{title:`${o.payStatus==='Not Paid'?'Chase payment':'Follow up'}: ${o.customer} ${money(o.amount)}`,note:`Order ${o.orderNo||''} on ${fdate(o.date)}`,orderId:o.id,storeId:sid(o)});break}
    case'del-row':case'del-order':{
      const o=a==='del-row'?find():S.orders.find(x=>x.id===$('#oform')?.dataset.id);if(!o)break;
      if(await askConfirm({title:'Delete this order?',body:`${ref(o)} · ${money(o.amount)}. It moves to Deleted, where a manager can restore it.`,ok:'Delete',danger:true})){
        closeSheet();commitOrder({...o,deleted:true,deletedAt:Date.now(),deletedBy:byMe()},o,'Deleted order');toast('Order deleted. Orders > Deleted to restore.')}
      break}
    case'restore-order':{const o=find();if(o){closeSheet();commitOrder({...o,deleted:false,restoredAt:Date.now()},o,'Restored order');toast('Order restored')}break}
    case'purge-order':{const o=find();if(o&&await askConfirm({title:'Delete for good?',body:`${ref(o)} will be removed permanently. This cannot be undone.`,ok:'Delete for good',danger:true})){
      write(()=>store.del('orders',o.id));audit('Deleted order permanently','order',o.id,ref(o),o,null);toast('Deleted permanently')}break}
    case'mark-paid':{const o=find();if(o){commitOrder({...o,payStatus:'Paid',updatedAt:Date.now(),updatedBy:byMe()},o);toast('Marked paid')}break}
    case'mark-delivered':{const o=find();if(o){commitOrder({...o,delStatus:'Delivered',updatedAt:Date.now(),updatedBy:byMe()},o);toast('Marked delivered')}break}
    case'undo':{const it=S.audit.find(x=>x.id===id);if(!it)break;const cur=S.orders.find(o=>o.id===it.entityId);
      const target=it.before?{...it.before,id:it.entityId}:cur?{...cur,deleted:true,deletedAt:Date.now(),deletedBy:byMe()}:null;
      if(!target){toast('That order no longer exists');break}
      if(await askConfirm({title:'Undo this change?',body:`${it.summary}`,ok:'Undo'})){commitOrder({...target,updatedAt:Date.now(),updatedBy:byMe()},cur||null,'Undid change');toast('Change undone')}
      break}
    case'step':{const el=$('#sheet').querySelector(`[name="${t.dataset.i}"]`);const mn=el.hasAttribute('min')?0:-999;el.value=Math.max(mn,(Math.trunc(+el.value)||0)+ +t.dataset.d);el.dispatchEvent(new Event('input',{bubbles:true}));break}
    case'use-list':{const f=$('#oform');f.dataset.touched='0';calcOrderForm();break}
    case'close-sheet':closeSheet();break;
    case'stock-new':stockSheet(t.dataset.t);break;
    case'stock-edit':if(isManager())stockSheet(null,id);break;
    case'del-stock':{const f=$('#sform');const e=S.stock.find(x=>x.id===f?.dataset.id);
      if(e&&await askConfirm({title:'Delete this stock record?',body:`${kinds[e.type]} ${fdate(e.date)}. Stock figures will be recalculated.`,ok:'Delete',danger:true})){
        closeSheet();write(()=>store.del('stock',e.id));audit('Deleted stock','stock',e.id,`${kinds[e.type]} ${fdate(e.date)} · ${itemsText(e.items)}`,e,null);toast('Stock record deleted')}break}
    case'stock-template':exportStockTemplate().catch(e=>toast(e.message));break;
    case'add-product':productSheet();break;
    case'export-xlsx':exportExcel().catch(e=>toast(e.message));break;
    case'staff-new':staffSheet();break;
    case'staff-edit':staffSheet(id);break;
    case'reminder-new':reminderSheet();break;
    case'reminder-edit':reminderSheet(id);break;
    case'reminder-done':reminderDone(id);break;
    case'reminder-del':{const f=$('#remform');const r=S.reminders.find(x=>x.id===f?.dataset.id);
      if(r&&canEditRem(r)&&await askConfirm({title:'Delete this reminder?',body:r.title,ok:'Delete',danger:true})){closeSheet();write(()=>store.del('reminders',r.id));audit('Deleted reminder','reminder',r.id,r.title,null,null,r.storeId||'');toast('Reminder deleted')}break}
    case'save-cfg':{const c={...(S.adminCfg||{}),id:'config',summaryOn:$('#cfg-sum').checked,summaryTime:$('#cfg-time').value||'08:00',extraTo:$('#cfg-to').value.trim()};
      write(()=>store.put('admin','config',c));toast('Email settings saved');break}
    case'signout':await store.signOut();break;
    case'use-local':lsSet('gdt_mode','local');store=Local;S.me={uid:'local',code:'you',name:'You',role:'admin',stores:[]};S.boot='ready';attach();render();break;
    case'reload':location.reload();break;
  }
});
document.addEventListener('focusin',ev=>{
  const el=ev.target;if(restoring||!el.classList?.contains('cell'))return;
  typingKey=null;if(el.tagName==='INPUT')try{el.select()}catch{}
});
document.addEventListener('keydown',ev=>{
  const el=ev.target;
  if(ev.key==='Escape'&&$('#sheet').classList.contains('open')&&!$('#dlg').classList.contains('open'))closeSheet();
  if((ev.key==='Enter'||ev.key===' ')&&(el.classList?.contains('ocard')||el.tagName==='LABEL'&&el.classList.contains('btn'))){ev.preventDefault();el.click()}
  if(ev.key==='Enter'&&el.classList?.contains('cell')&&el.tagName==='INPUT'){
    ev.preventDefault();
    const tr=el.closest('tr');const idx=[...tr.children].indexOf(el.closest('td'));
    const next=(ev.shiftKey?tr.previousElementSibling:tr.nextElementSibling)?.children[idx]?.querySelector('.cell');
    if(next){next.focus();next.select?.()}else el.blur();
  }
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.classList?.contains('cell'))typingKey=el.dataset.k;
  if(el.id==='q'){S.f.q=el.value;$('#olist').innerHTML=orderListHtml();return}
  if(el.id==='cq'){S.cq=el.value;const p=el.selectionStart;render();const n=$('#cq');if(n){n.focus();try{n.setSelectionRange(p,p)}catch{}}return}
  if(el.closest('#oform')){if(el.name==='amount')el.form.dataset.touched='1';calcOrderForm()}
});
document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.classList.contains('cell')){updateCell(el.dataset.oid,el.dataset.col,el.value);return}
  if(el.id==='ff'||el.id==='ft'){S.f[el.id==='ff'?'from':'to']=el.value;$('#olist').innerHTML=orderListHtml();return}
  if(el.id==='xlin'&&el.files[0]){
    toast('Reading Excel file…');
    try{const r=await importExcel(el.files[0],$('#xlstore')?.value);toast(`Imported ${r.no} orders and ${r.ns} stock records${r.dup?` (${r.dup} already there)`:''}${r.skipped?`. ${r.skipped} cylinders had an unknown size`:''}`)}
    catch(e){toast('Import failed: '+e.message)}
    el.value='';return;
  }
  if(el.id==='stockxl'&&el.files[0]){
    const f=el.files[0];el.value='';toast('Reading '+f.name+'…');
    try{const es=await parseStockExcel(f);if(!es.length){toast('No stock figures found in that file. Try the stock template.');return}reviewSheet(es,f.name)}
    catch(e){toast('Could not read the file: '+e.message)}
    return;
  }
  if(el.id==='stockpdf'&&el.files[0]){
    const f=el.files[0];el.value='';toast('Reading '+f.name+'…');
    try{const r=await parseStockPdf(f);
      if(!r.lineCount){toast('That PDF has no readable text (it may be a scan). Enter the stock by hand.');return}
      reviewSheet([{type:'in',date:r.date||today(),items:r.items,notes:'Delivery note '+f.name,found:r.found}],f.name);
      if(!r.found.length)toast('No cylinder lines recognised. Fill the numbers in yourself.');
    }catch(e){toast('Could not read the PDF: '+e.message)}
    return;
  }
  if(el.name==='storeId'&&el.closest('#oform')){const f=el.form;
    if(!f.dataset.id&&f.elements.orderNo.value===f.dataset.autono){f.dataset.autono=nextOrderNo(el.value);f.elements.orderNo.value=f.dataset.autono}
    updateAvail(f);return}
  if(el.name==='storeId'&&el.closest('#sform')&&!el.form.dataset.id&&el.form.dataset.t==='count'){const f=el.form;
    stockSheet('count',null,{storeId:el.value,date:f.elements.date.value,notes:f.elements.notes.value});return}
  if(el.name==='customer'&&el.closest('#oform')&&!el.form.dataset.id){
    const f=el.form,nm=el.value.trim().toLowerCase();
    const prev=[...live()].sort(cmpOrders).find(o=>(o.customer||'').trim().toLowerCase()===nm);
    if(prev)['phone','address','postcode'].forEach(k=>{if(f.elements[k]&&!f.elements[k].value)f.elements[k].value=prev[k]||''});
  }
  if(el.dataset.act==='prod-edit'){
    const pid=el.closest('[data-pid]').dataset.pid;const fld=el.dataset.f;
    const ps=products().map(p=>({...p}));const p=ps.find(x=>x.id===pid);
    if(fld==='active')p.active=el.checked;else p[fld]=Math.max(0,+el.value||0);
    saveSettings(ps);toast('Saved');
  }
});
document.addEventListener('submit',ev=>{
  const f=ev.target;ev.preventDefault();
  if(f.id==='oform')saveOrder(f);
  else if(f.id==='sform')saveStock(f);
  else if(f.id==='revform')saveReview(f);
  else if(f.id==='staffform')saveStaff(f);
  else if(f.id==='manualform'){const nu=f.elements.uid.value.trim();if(!/^[A-Za-z0-9]{20,40}$/.test(nu)){$('#muerr').textContent='That does not look like a User UID.';return}
    const nm=S.pending?.name;finishStaff(nu).then(()=>{closeSheet();toast('Login ready for '+nm)}).catch(e=>{$('#muerr').textContent=e.message})}
  else if(f.id==='remform')saveReminder(f);
  else if(f.id==='storeform')saveStore(f);
  else if(f.id==='rwform')saveRwStores(f);
  else if(f.id==='flagform'){
    const o=S.orders.find(x=>x.id===f.dataset.id);const reason=f.elements.reason.value.trim();
    if(!o||!reason)return toast('Say what is wrong');
    closeSheet();commitOrder({...o,flag:{open:true,reason,by:byMe(),byUid:S.me.uid,at:Date.now()},updatedAt:Date.now()},o,'Flagged a doubt');toast('Flagged. A manager will check it.');
  }
  else if(f.id==='resform'){
    const o=S.orders.find(x=>x.id===f.dataset.id);if(!o)return;
    closeSheet();commitOrder({...o,flag:{...o.flag,open:false,resolvedNote:f.elements.note.value.trim(),resolvedBy:byMe(),resolvedAt:Date.now()},updatedAt:Date.now()},o,'Resolved doubt');toast('Doubt resolved');
  }
  else if(f.id==='pform'){
    const ps=products().map(p=>({...p}));
    ps.push({id:'p'+Date.now().toString(36),group:f.elements.group.value,label:f.elements.label.value.trim(),price:r2(f.elements.price.value),low:Math.max(0,+f.elements.low.value||0),active:true});
    saveSettings(ps);closeSheet();toast('Product added')}
  else if(f.id==='login')doLogin(f);
});
addEventListener('online',()=>{S.online=true;if(S.boot==='ready')render()});
addEventListener('offline',()=>{S.online=false;if(S.boot==='ready')render()});
setInterval(()=>{if(S.boot==='ready'&&!document.querySelector('#sheet.open')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},60000);

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
